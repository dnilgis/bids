# RECON. Run by hand, reads pages, prints what it finds, commits nothing.
#
# Three boards we want are JavaScript applications — StoneX Stonehedge (United
# Cooperative, 24 locations), DTN's content-services cash-bids widget (Farmers
# Cooperative Society, probably Albert Lea) — and a plain GET of those pages
# returns a shell, not prices. The request that returns prices is a string
# inside their bundle. scripts/probe.mjs walks the page, fetches every script it
# loads, and prints every URL-shaped string with the code around it.
#
# It lives here rather than in the workspace it was written in because that
# workspace sits behind an allowlist proxy that answers "Host not in allowlist"
# for every elevator on earth. This runner has a normal internet connection.
#
# HOW TO USE IT
#   Actions -> probe -> Run workflow -> (optionally paste your own URLs) -> Run.
#   Then open the run, download the log, and send it over.
#
# It writes nothing, commits nothing, and touches no file in data/. Failing
# steps do not stop the others: each target is independent evidence.

name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe INSTEAD of the built-in targets (leave blank to use them)"
        required: false
        default: ""
      referer:
        description: "Referer/Origin header to send with your own URLs (an iframe's parent page)"
        required: false
        default: ""
      all_origins:
        description: "Also follow scripts hosted on other domains"
        type: boolean
        default: true
      raw:
        # THE URLS BOX COULD NOT PRINT A JSON BODY, WHICH IS WHAT WE NOW WANT
        # FROM IT. probe.mjs takes --raw <bytes> and the built-in steps pass it;
        # the "Your URLs" step never did, so pasting an API URL walked it like a
        # web page, found no scripts, and printed the first 600 bytes at most.
        # DTN's grain-bids elevator directory answers with an array of every
        # elevator in a state, which is a great deal more than 600 bytes.
        description: "Bytes of the response body to print (e.g. 400000). Leave blank for the default 40000."
        required: false
        default: ""
      dtn_key:
        # A LICENSED DTN key, if one is ever bought. Their documented sample key
        # is browser-scoped and answers AGW-403=002 to everything — measured
        # 2026-08-22 on the elevator directory, on MN, and on commodities. With
        # a real key the directory returns every elevator in a state with city,
        # county, postalCode, fips, latitude and longitude. Left blank, the step
        # that uses it does not run.
        description: "A licensed DTN Markets API key, to fetch the national elevator directory. Blank = skip."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # The inputs go through the environment rather than into the command line
      # by template substitution: a URL is attacker-shaped text, and `${{ }}`
      # inside `run:` is pasted into the shell before bash ever sees it.
      - name: Your URLs
        if: inputs.urls != ''
        continue-on-error: true
        env:
          URLS: ${{ inputs.urls }}
          REFERER: ${{ inputs.referer }}
          RAW: ${{ inputs.raw }}
          ALL_ORIGINS: ${{ inputs.all_origins }}
        run: |
          args=""
          [ -n "$REFERER" ] && args="$args --referer $REFERER"
          [ "$ALL_ORIGINS" = "true" ] && args="$args --all-origins"
          case "$RAW" in
            "" ) ;;
            *[!0-9]* ) echo "raw must be a number of bytes; ignoring \"$RAW\"" ;;
            * ) args="$args --raw $RAW" ;;
          esac
          node scripts/probe.mjs $URLS $args

      # ---- built-in targets, only when no URLs were supplied ----

      # HOW MANY ELEVATORS ARE WAITING BEHIND THAT ENDPOINT?
      #
      # There is no index: /api/public-sites is 404, /api/public-sites/<token>
      # alone is 404, and an unknown token is 401 {"error":"Unauthorized"}. The
      # only discovery surface is asking. So ask -- once per candidate, four at
      # a time, 150ms apart -- using every operator name we have: the 266
      # distinct facilities in today's Barchart pull plus every company met
      # while mapping platforms tonight.
      #
      # A hit is worth more than one elevator: DTN's own default token,
      # stLawrenceGrain, carries two destinations.
      - name: DTN Grain Desk — sweep for company tokens
        if: inputs.urls == ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          node scripts/gd-sweep.mjs --file probe-lists/gd-candidates.txt --as-names \
            --concurrency 4 --delay 150

      # DTN PUBLISHES A GRAIN BIDS REST API, AND A TEST KEY FOR IT.
      #   spec: cp-docs.dtn.com/content-packages/api-specs/markets-grain-bids-api/
      #         markets-grain-bids-oas-1.1.yaml
      #   test key: oViXqthDGFNVw3IvAsnKrFG1AcfPyA6b  (documented, sample data)
      # The docs say the key reaches "commodity, elevator, FIPS region and USDA
      # region details" — an elevator directory, which is the thing this whole
      # census has been missing. The spec came back as binary through every
      # reader available in the workspace; fetch it raw here and I will read the
      # paths off the log.
      - name: DTN Markets Grain Bids — the OpenAPI spec, raw
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --raw 400000 \
            'https://cp-docs.dtn.com/content-packages/api-specs/markets-grain-bids-api/markets-grain-bids-oas-1.1.yaml'

      # THE ELEVATOR DIRECTORY — THE WHOLE CENSUS IN ONE CALL, IF THE KEY REACHES IT.
      #
      # Read off the spec above on 2026-08-22. This is a DIFFERENT DTN PRODUCT
      # from the cash-bids widget every source in this repo currently uses. The
      # widget is keyed per customer, scoped to a browser, and has NO INDEX —
      # which is why coverage has been built one co-operative at a time, eight
      # site ids for sixty-nine locations. This one is a plain REST search:
      #
      #   GET /markets/grain-bids/elevators?country=USA&state=WI&active=Y
      #
      # and each record carries a name, a business type, and an address with
      # city, county, state, postalCode, fips, LATITUDE and LONGITUDE — all of
      # them required fields in the schema. Those are exactly the fields the 45
      # generated sources currently leave as SET THIS.
      #
      # IT IS A BUILT-IN TARGET RATHER THAN SOMETHING TO PASTE. The urls box was
      # left blank on two runs in a row and both produced an identical log, so
      # the step that has to happen should not depend on remembering to fill in
      # a box. Blank is the normal way to run this workflow.
      #
      # THE KEY IS DTN'S OWN PUBLISHED SAMPLE KEY, printed in the comment eleven
      # lines above and documented in their spec. It is not ours and it is not
      # secret. probe.mjs cannot send a custom header, so it travels in the query
      # string; the rule that a key is a header and never a query parameter
      # exists so OUR credentials stay out of a public Actions log, and there is
      # nothing of ours here to keep out of it.
      #
      # ══ ANSWERED 2026-08-22, run 88363539257. THE SAMPLE KEY CANNOT REACH IT. ══
      #
      # All three calls — WI, MN, and commodities — came back identically:
      #
      #   403  {"type":"Authorization","id":"AGW-403=002",
      #         "message":"The api key is valid, but it is valid to be used
      #                    within a browser only."}
      #
      # THE SAME GATEWAY RULE AS THE WIDGET, on a completely different product.
      # The key is valid; DTN scopes it to browser use, and no server-side
      # request passes that check however well-formed it is.
      #
      # The commodities call is why we know WHICH thing refused. One 403 on the
      # directory alone would have left "is it the key or the state filter?"
      # open, and the obvious next move would have been to fiddle with query
      # parameters for an hour. Two identical 403s on the simplest endpoint in
      # the spec close that off: it is the key.
      #
      # THIS IS NOT A THING TO ROUTE AROUND. There is no customer page that
      # requests /markets/grain-bids/elevators — the 2026-08-22 survey showed
      # the widgets ask only for /markets/sites/<id>/cash-bids — so driving it
      # from inside a browser would mean manufacturing a request no page makes,
      # which is the forged Origin/Referer that Sig ruled out on 2026-08-20.
      # The directory is real, it is exactly what a national census needs, and
      # reaching it takes a licensed key from DTN. That is a commercial
      # conversation, not a technical one.
      #
      # THE STEP STAYS, GATED ON A KEY. If a real one ever arrives, put it in
      # the dtn_key box and this answers without anybody rediscovering the
      # endpoint. Left blank it does not run, because running it again with the
      # sample key would print the same 403 and teach nobody anything.
      - name: DTN Markets Grain Bids — the elevator directory (needs a licensed key)
        if: inputs.urls == '' && inputs.dtn_key != ''
        continue-on-error: true
        env:
          DTN_KEY: ${{ inputs.dtn_key }}
        run: |
          BASE='https://api.dtn.com/markets/grain-bids/elevators'
          node scripts/probe.mjs --raw 400000 \
            "https://api.dtn.com/markets/grain-bids/commodities?apikey=$DTN_KEY" \
            "$BASE?apikey=$DTN_KEY&country=USA&state=WI&active=Y" \
            "$BASE?apikey=$DTN_KEY&country=USA&state=MN&active=Y"

      # StoneX: the component's own call is still unfound, but the API publishes
      # Swagger at /swagger/index.html and the document loads from somewhere.
      # Read the UI page raw and follow whatever spec URL it names.
      - name: StoneX — the swagger document
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --all-origins --raw 60000 \
            --grep 'swagger[^"]{0,60}\.json|openapi[^"]{0,60}\.json|urls: ?\[' \
            'https://api.stonehedge.stonex.com/swagger/index.html'
