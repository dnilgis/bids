# RECON. Run by hand, reads pages, prints what it finds, commits nothing.
#
# Three boards we want are JavaScript applications — StoneX Stonehedge (United
# Cooperative, 24 locations), DTN's content-services cash-bids widget (Farmers
# Cooperative Society, probably Albert Lea) — and a plain GET of those pages
# returns a shell, not prices. The request that returns prices is a string
# inside their bundle. scripts/probe.mjs walks the page, fetches every script it
# loads, and prints every URL-shaped string with the code around it.
#
# It lives here rather than in the workspace it was written in because that
# workspace sits behind an allowlist proxy that answers "Host not in allowlist"
# for every elevator on earth. This runner has a normal internet connection.
#
# HOW TO USE IT
#   Actions -> probe -> Run workflow -> (optionally paste your own URLs) -> Run.
#   Then open the run, download the log, and send it over.
#
# It writes nothing, commits nothing, and touches no file in data/. Failing
# steps do not stop the others: each target is independent evidence.

name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe INSTEAD of the built-in targets (leave blank to use them)"
        required: false
        default: ""
      referer:
        description: "Referer/Origin header to send with your own URLs (an iframe's parent page)"
        required: false
        default: ""
      all_origins:
        description: "Also follow scripts hosted on other domains"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # The inputs go through the environment rather than into the command line
      # by template substitution: a URL is attacker-shaped text, and `${{ }}`
      # inside `run:` is pasted into the shell before bash ever sees it.
      - name: Your URLs
        if: inputs.urls != ''
        continue-on-error: true
        env:
          URLS: ${{ inputs.urls }}
          REFERER: ${{ inputs.referer }}
          ALL_ORIGINS: ${{ inputs.all_origins }}
        run: |
          args=""
          [ -n "$REFERER" ] && args="$args --referer $REFERER"
          [ "$ALL_ORIGINS" = "true" ] && args="$args --all-origins"
          node scripts/probe.mjs $URLS $args

      # ---- built-in targets, only when no URLs were supplied ----

      # THE GRAIN DESK BUNDLE HOLDS ITS ENDPOINT IN A TEMPLATE LITERAL.
      #   window.ENV = {
      #     AG_PRODUCER_API_URL: "https://agproducer.prd.ag.zones.dtn.com/api/v1",
      #     GD_CASH_BIDS_API_URL: "https://marketplace.graindiscovery.com/api",
      #     DEFAULT_COMPANY_TOKEN: "stLawrenceGrain" }
      # so the call is `${GD_CASH_BIDS_API_URL}/…` and there is no quoted URL to
      # find -- which is why the last run returned thirteen strings and none of
      # them the one. --grep goes looking for the shape instead.
      - name: DTN Grain Desk — grep the bundle for the call
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --context 200 \
            --grep 'companyToken|GD_CASH_BIDS_API_URL|cash[-_]?bids|graphql|query [A-Za-z]+ ?\(' \
            'https://agproducer.prd.ag.zones.dtn.com/grain-desk/cash-bids/dtn-gd-cash-bids.bundle.js'

      # 92 chunks were named and half the budget went on relative twins that all
      # returned the same 5,858-byte shell. v4 fetches the root form only and
      # sorts bid/cash/component-sounding names to the front.
      - name: StoneX Stonehedge — the chunks that sound like the board
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --all-origins --max-chunks 92 --context 160 \
            --grep 'api\.stonehedge[^"'"'"'`]{0,80}|/bids[a-z/-]*|componentBids|publicBids' \
            --referer 'https://www.unitedcooperative.com/grain/markets' \
            'https://stonehedge.stonex.com/component/bids?key=AILQAFBJPWG59NXDNV00QPRSFTUA0EEU&cols=date%2Cbasis%2Ccash%2Cmonth&locs=8TG9IQ1J6TGRFBUP1XH0%2CMY33N2HTBP5KB5I5NXBT&hideRows=true'

      # Farmers Cooperative Society is READ as of tonight -- the adapter and the
      # source row are in this drop. What is still needed is the location ids
      # for their other elevators, which their own locations page carries and
      # which /ajax/pages/dtn-cash-bids?location=<id> then serves.
      - name: Farmers Cooperative Society — the other locations' ids
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --raw 200000 \
            --grep 'location=[0-9A-Za-z_-]+|dtn-cash-bids[^"]{0,60}' \
            'https://www.farmerscoopsociety.com/locations?services=grain' \
            'https://www.farmerscoopsociety.com/grain/grain-services'
