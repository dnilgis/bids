# RECON. Run by hand, reads pages, prints what it finds, commits nothing.
#
# Three boards we want are JavaScript applications — StoneX Stonehedge (United
# Cooperative, 24 locations), DTN's content-services cash-bids widget (Farmers
# Cooperative Society, probably Albert Lea) — and a plain GET of those pages
# returns a shell, not prices. The request that returns prices is a string
# inside their bundle. scripts/probe.mjs walks the page, fetches every script it
# loads, and prints every URL-shaped string with the code around it.
#
# It lives here rather than in the workspace it was written in because that
# workspace sits behind an allowlist proxy that answers "Host not in allowlist"
# for every elevator on earth. This runner has a normal internet connection.
#
# HOW TO USE IT
#   Actions -> probe -> Run workflow -> (optionally paste your own URLs) -> Run.
#   Then open the run, download the log, and send it over.
#
# It writes nothing, commits nothing, and touches no file in data/. Failing
# steps do not stop the others: each target is independent evidence.

name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe INSTEAD of the built-in targets (leave blank to use them)"
        required: false
        default: ""
      referer:
        description: "Referer/Origin header to send with your own URLs (an iframe's parent page)"
        required: false
        default: ""
      all_origins:
        description: "Also follow scripts hosted on other domains"
        type: boolean
        default: true
      raw:
        # THE URLS BOX COULD NOT PRINT A JSON BODY, WHICH IS WHAT WE NOW WANT
        # FROM IT. probe.mjs takes --raw <bytes> and the built-in steps pass it;
        # the "Your URLs" step never did, so pasting an API URL walked it like a
        # web page, found no scripts, and printed the first 600 bytes at most.
        # DTN's grain-bids elevator directory answers with an array of every
        # elevator in a state, which is a great deal more than 600 bytes.
        description: "Bytes of the response body to print (e.g. 400000). Leave blank for the default 40000."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # The inputs go through the environment rather than into the command line
      # by template substitution: a URL is attacker-shaped text, and `${{ }}`
      # inside `run:` is pasted into the shell before bash ever sees it.
      - name: Your URLs
        if: inputs.urls != ''
        continue-on-error: true
        env:
          URLS: ${{ inputs.urls }}
          REFERER: ${{ inputs.referer }}
          RAW: ${{ inputs.raw }}
          ALL_ORIGINS: ${{ inputs.all_origins }}
        run: |
          args=""
          [ -n "$REFERER" ] && args="$args --referer $REFERER"
          [ "$ALL_ORIGINS" = "true" ] && args="$args --all-origins"
          case "$RAW" in
            "" ) ;;
            *[!0-9]* ) echo "raw must be a number of bytes; ignoring \"$RAW\"" ;;
            * ) args="$args --raw $RAW" ;;
          esac
          node scripts/probe.mjs $URLS $args

      # ---- built-in targets, only when no URLs were supplied ----

      # HOW MANY ELEVATORS ARE WAITING BEHIND THAT ENDPOINT?
      #
      # There is no index: /api/public-sites is 404, /api/public-sites/<token>
      # alone is 404, and an unknown token is 401 {"error":"Unauthorized"}. The
      # only discovery surface is asking. So ask -- once per candidate, four at
      # a time, 150ms apart -- using every operator name we have: the 266
      # distinct facilities in today's Barchart pull plus every company met
      # while mapping platforms tonight.
      #
      # A hit is worth more than one elevator: DTN's own default token,
      # stLawrenceGrain, carries two destinations.
      - name: DTN Grain Desk — sweep for company tokens
        if: inputs.urls == ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          node scripts/gd-sweep.mjs --file probe-lists/gd-candidates.txt --as-names \
            --concurrency 4 --delay 150

      # DTN PUBLISHES A GRAIN BIDS REST API, AND A TEST KEY FOR IT.
      #   spec: cp-docs.dtn.com/content-packages/api-specs/markets-grain-bids-api/
      #         markets-grain-bids-oas-1.1.yaml
      #   test key: oViXqthDGFNVw3IvAsnKrFG1AcfPyA6b  (documented, sample data)
      # The docs say the key reaches "commodity, elevator, FIPS region and USDA
      # region details" — an elevator directory, which is the thing this whole
      # census has been missing. The spec came back as binary through every
      # reader available in the workspace; fetch it raw here and I will read the
      # paths off the log.
      - name: DTN Markets Grain Bids — the OpenAPI spec, raw
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --raw 400000 \
            'https://cp-docs.dtn.com/content-packages/api-specs/markets-grain-bids-api/markets-grain-bids-oas-1.1.yaml'

      # StoneX: the component's own call is still unfound, but the API publishes
      # Swagger at /swagger/index.html and the document loads from somewhere.
      # Read the UI page raw and follow whatever spec URL it names.
      - name: StoneX — the swagger document
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --all-origins --raw 60000 \
            --grep 'swagger[^"]{0,60}\.json|openapi[^"]{0,60}\.json|urls: ?\[' \
            'https://api.stonehedge.stonex.com/swagger/index.html'
