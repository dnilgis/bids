# RECON. Run by hand, reads pages, prints what it finds, commits nothing.
#
# Three boards we want are JavaScript applications — StoneX Stonehedge (United
# Cooperative, 24 locations), DTN's content-services cash-bids widget (Farmers
# Cooperative Society, probably Albert Lea) — and a plain GET of those pages
# returns a shell, not prices. The request that returns prices is a string
# inside their bundle. scripts/probe.mjs walks the page, fetches every script it
# loads, and prints every URL-shaped string with the code around it.
#
# It lives here rather than in the workspace it was written in because that
# workspace sits behind an allowlist proxy that answers "Host not in allowlist"
# for every elevator on earth. This runner has a normal internet connection.
#
# HOW TO USE IT
#   Actions -> probe -> Run workflow -> (optionally paste your own URLs) -> Run.
#   Then open the run, download the log, and send it over.
#
# It writes nothing, commits nothing, and touches no file in data/. Failing
# steps do not stop the others: each target is independent evidence.

name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe INSTEAD of the built-in targets (leave blank to use them)"
        required: false
        default: ""
      referer:
        description: "Referer/Origin header to send with your own URLs (an iframe's parent page)"
        required: false
        default: ""
      all_origins:
        description: "Also follow scripts hosted on other domains"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # The inputs go through the environment rather than into the command line
      # by template substitution: a URL is attacker-shaped text, and `${{ }}`
      # inside `run:` is pasted into the shell before bash ever sees it.
      - name: Your URLs
        if: inputs.urls != ''
        continue-on-error: true
        env:
          URLS: ${{ inputs.urls }}
          REFERER: ${{ inputs.referer }}
          ALL_ORIGINS: ${{ inputs.all_origins }}
        run: |
          args=""
          [ -n "$REFERER" ] && args="$args --referer $REFERER"
          [ "$ALL_ORIGINS" = "true" ] && args="$args --all-origins"
          node scripts/probe.mjs $URLS $args

      # ---- built-in targets, only when no URLs were supplied ----

      # SOLVED, AND WORTH CAPTURING PROPERLY.
      #   GET https://marketplace.graindiscovery.com/api/public-sites/<token>/cash-bids
      # The adapter shipped against a SAMPLE that came back through a
      # summarising reader, not raw bytes. This prints the real body so the
      # fixture can be replaced with a capture -- the exact step skipped twice
      # on Flash Grain, both times to our cost.
      - name: DTN Grain Desk — capture Albert Lea's raw JSON
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --raw 400000 \
            'https://marketplace.graindiscovery.com/api/public-sites/albertleaelevator/cash-bids'

      # If the token really is just the slug, these answer too — and each one
      # that does is an elevator added by writing a JSON file.
      - name: DTN Grain Desk — do other slugs answer?
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          for t in northsideelevator flashgrain unitedcooperative farmerscoopsociety \
                   albertleaseedhouse stLawrenceGrain lockiefarms; do
            echo "### $t"
            node scripts/probe.mjs --raw 1200 \
              "https://marketplace.graindiscovery.com/api/public-sites/$t/cash-bids" || true
          done

      # StoneX: the component's own call is still unfound, but the API publishes
      # Swagger at /swagger/index.html and the document loads from somewhere.
      # Read the UI page raw and follow whatever spec URL it names.
      - name: StoneX — the swagger document
        if: inputs.urls == ''
        continue-on-error: true
        run: |
          node scripts/probe.mjs --all-origins --raw 60000 \
            --grep 'swagger[^"]{0,60}\.json|openapi[^"]{0,60}\.json|urls: ?\[' \
            'https://api.stonehedge.stonex.com/swagger/index.html'
