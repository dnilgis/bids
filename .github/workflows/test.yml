# The gate. Runs on every push, and only on push.
#
# It covers lib/, scripts/ and worker/ -- both readers and the shared core.
#
# It lives apart from poll.yml on purpose: the reader's code does not change
# between polls, so running the suite on every one of ~1,650 monthly polls
# proves nothing, doubles each run, and buries a real failure in noise. Here it
# runs when the thing it tests actually changed.

name: test

on:
  push:
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'worker/**'
      - 'test/**'
      - 'fixtures/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
