# Run the whole suite. Every file, both languages, on every human push.
#
# WHY THIS DID NOT EXIST UNTIL 2026-09-01, AND WHY THAT MATTERED
#
# This repository has 1,112 tests. Thirteen workflows, and not one of them ran
# `npm test`. Each runs a hand-picked list instead — bushel-probe runs three
# files, geocode-fill runs three, discover runs three — which left
#
#     24 of 42 test files run by NOTHING
#
# among them board.test.mjs, parse.test.mjs, guards.test.mjs and
# registries.test.mjs: the readers this whole repository is. They passed only
# when somebody typed `npm test` on a laptop, and Sig works in the browser, so
# that was nobody.
#
# It was found the third time Sig asked "are you sure". The first answer had
# been "two python guards are never run" — which was true and far too small.
# The real answer was that the suite itself had never been wired to anything.
#
# THE HAND-PICKED LISTS STAY. A job about to spend an hour geocoding should
# check its own readers first and fail in two seconds if they are broken; that
# is cheap and it fails fast at the right moment. This is the backstop
# underneath them, not a replacement for them.
#
# ON: PUSH, AND WHY THAT IS ENOUGH HERE
#
# A push made with GITHUB_TOKEN triggers nothing — that is a GitHub rule and it
# is why the briefing heartbeat had to be rebuilt as a dispatch on 2026-09-01.
# So the poller's commits, and this repo's other bot commits, will NOT fire
# this. Sig uploading files through the browser WILL, and that is the moment
# that matters: it is the only time a person changes the code.
#
# The daily cron is the backstop for everything the push trigger cannot see,
# including a dependency or a Node change that breaks a test nobody touched.

name: tests

on:
  push:
  pull_request:
  schedule:
    # 11:07 UTC daily. Not on the hour: GitHub's scheduler is most congested at
    # :00, when every cron on the platform fires at once.
    - cron: "7 11 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    # The suite runs in about 100 seconds. Ten minutes is six times that and
    # still nowhere near GitHub's six-hour default, which a job with no ceiling
    # inherits.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE WHOLE JAVASCRIPT SUITE. Not a list — the glob, so a new test file is
      # covered the moment it is added and nobody has to remember a workflow.
      - name: node
        run: npm test

      # AND THE PYTHON GUARDS, WHICH THE GLOB CANNOT SEE.
      # `npm test` is `node --test test/*.test.mjs`. A guard written in python is
      # invisible to it, which is exactly how registry-run-together.test.py and
      # unplaced-reason.test.py came to be committed, passing, and unrun.
      # Globbed here too, for the same reason: a list would go stale.
      # THE DEPENDENCIES THE PYTHON GUARDS PULL IN, INSTALLED BEFORE THEY RUN.
      #
      # This step shipped without this line and FAILED ON ITS FIRST REAL RUN,
      # 2026-09-01, run 90958378657:
      #
      #     ── test/unplaced-reason.test.py
      #     FATAL: pip install zipcodes
      #     ##[error]Process completed with exit code 2.
      #
      # That guard imports scripts/build_geocodes.py to read the sentences it
      # builds, and build_geocodes.py imports `zipcodes` at module level.
      #
      # IT IS THE THIRD TIME. schedule-guard.yml went red with "No module named
      # 'yaml'" on 2026-08-31 for the same reason, and registries.yml already
      # carries a pip install for pypdf that exists because of the same thing.
      # A workflow that needs a package and installs nothing is a workflow that
      # goes red the first time it matters — and this one went red in the very
      # file added to stop guards from never running.
      #
      # test/every-guard-runs.test.mjs now checks this, so the fourth time is
      # caught here rather than on the runner.
      - name: python dependencies
        run: pip install --quiet zipcodes pypdf

      - name: python
        run: |
          shopt -s nullglob
          found=0
          for t in test/*.test.py; do
            echo "── $t"
            python "$t"
            found=$((found + 1))
          done
          # FINDING NOTHING IS A FAILURE, NOT A QUIET SUCCESS.
          # This printed a note and exited 0, which means a green tick could mean
          # "every python guard passed" or "the glob matched nothing and I ran
          # none of them", and nobody could tell which. There ARE python guards
          # in this repository; zero means they moved or were deleted, and that
          # is exactly the state this workflow exists to notice.
          if [ "$found" -eq 0 ]; then
            echo "::error::no test/*.test.py found. There are python guards in this repo —"
            echo "::error::if they moved, this glob has to move with them. Running none of"
            echo "::error::them must never be a green tick."
            exit 1
          fi
          echo "$found python test file(s) passed"
