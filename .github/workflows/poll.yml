# Read Big River's Boyceville board and commit it when the price moves.
#
# CADENCE
#
# Every 10 minutes through the trading day, hourly at night, every 4 hours at
# weekends. Their footer says prices are delayed 10 minutes and the page
# self-refreshes every 5, so 10 is matched to the source rather than to a wish.
#
# BEST-EFFORT, AND YOU SHOULD KNOW IT. GitHub does not promise scheduled
# workflows run on time. Under load they are delayed, and occasionally dropped
# entirely. Ten to twenty minute lags at busy times are normal and not a fault.
#
# That is fine here and it is worth being explicit about why: every consumer
# checks `checkedAt`, and the Emmert sites do not withdraw a price until it is
# fourteen hours stale. A twenty-minute lag is inside the noise. The cadence is
# matched to their board -- their footer says prices are delayed ten minutes --
# not to a requirement that anything happen on a particular second.
#
# This repo is PUBLIC, which is what makes this affordable: Actions minutes are
# unmetered on public repos. On a private repo this schedule is about 1,650 runs
# a month against a 2,000-minute allowance — 83%, or 165% if a run ever creeps
# past 60 seconds. If you ever make this repo private, cut the cadence first.
#
# THIS IS THE READER. There is no other one.
#
# A Cloudflare Worker version was built and then removed on 2026-08-17. It
# bought punctuality that this system does not need -- a twenty-minute lag is
# nothing against the fourteen-hour staleness threshold the Emmert sites
# actually use -- and it cost a second vendor, secrets in two places, a runtime
# that differs from Node in ways that already bit us once, and seven-day log
# retention against GitHub's ninety. Actions also has no CPU ceiling, which is
# the limit that would have bound first as more elevators are added.
#
# NO TESTS HERE, DELIBERATELY. The code does not change between polls, so
# running the suite 1,650 times a month proves nothing and doubles the run time.
# Tests run on push instead, in test.yml. A poll that finds no change writes
# nothing and commits nothing.

name: read boyceville

on:
  schedule:
    # Every 10 minutes through the trading day. 12:00-21:59 UTC covers
    # 7am-4pm Central in both CST and CDT, so the clocks changing cannot
    # quietly shift the window out of market hours.
    #
    # WRITTEN OUT RATHER THAN AS */10, TO DODGE THE TOP OF THE HOUR.
    # GitHub's scheduler is best effort and it is most congested on the exact
    # minute -- :00 is when every cron on the platform fires at once, so a job
    # asking for :00 waits behind all of them. Offsetting to :03 costs nothing
    # and lands in a quieter queue. The spacing is still ten minutes.
    #
    # CHANGED 2026-08-26: ONE FIRE AN HOUR, AND THE JOB READS ALL HOUR.
    # This asked for six fires an hour and was given one or two. Measured on
    # 2026-08-26, in the trading window, where every run commits so commits are
    # an exact run count: 13 UTC 3 runs, 14 UTC 2, 15 UTC 1, 16 UTC 1 -- and
    # some of those were fired by hand. Outside the window, where this file
    # asks for ONE an hour, it got one every hour with no misses.
    # Same repository, same day, same scheduler. GitHub is far better at a low
    # frequency than a high one, so the fix is to stop asking for a high one:
    # take the fire that reliably arrives and read repeatedly inside it. See
    # LOOP_MINUTES below.
    #
    # REVERSED 2026-08-27. THE LOOP WAS THE WRONG FIX AND IT MADE THIS WORSE.
    # Measured over every commit in the repository, counting weekday hours that
    # produced at least one commit -- a commit happens on every pass, so this
    # is an exact record of whether the reader ran:
    #
    #     BEFORE the 50-minute loop   94 of 116 weekday hours   81.0%
    #     AFTER  the 50-minute loop    8 of  26 weekday hours   30.8%
    #
    # Asking for one fire an hour and holding the runner for fifty minutes of
    # it did not buy reliability, it cost two thirds of what was left. On
    # 2026-08-27 the repository went 6+ hours with eighteen fires due and not
    # one arriving: no queued runs, no cancelled runs, nothing red, while
    # push-triggered workflows in the same repository ran fine and a sibling
    # repository on the same account committed every thirty minutes through
    # the whole afternoon. GitHub had stopped scheduling THIS repository.
    #
    # A job that occupies a runner for fifty of every sixty minutes is, from
    # the scheduler's point of view, a persistent server, and that is a shape
    # Actions actively throttles. Three short passes an hour cost about six
    # minutes of runner time instead of fifty.
    #
    # AND THE MEASUREMENT THAT JUSTIFIED THE LOOP WAS CONTAMINATED. It read
    # "13 UTC 3 runs, 14 UTC 2, 15 UTC 1, 16 UTC 1" against six asked per hour
    # -- but githubstatus.com records an Actions incident from 15:02 to 18:01
    # UTC that same day, "Actions jobs failed to start", so the 15 and 16 UTC
    # readings are the incident, not the scheduler's normal behaviour.
    #
    # SIX AN HOUR, AND KNOWING WHAT THAT REALLY BUYS.
    # Sig wants a read every ten minutes through the trading day. Asked for,
    # here, in full. What GitHub actually delivered the last time this file
    # asked for exactly this, counted over every commit from 2026-08-18 to
    # 2026-08-26 and with both of GitHub's own Actions incidents that week
    # excluded from the count:
    #
    #     380 fires asked      66 delivered      17.4%
    #     mean 1.7 reads per trading hour, median gap between reads 36 minutes
    #
    # So this cron is the ceiling, not the cadence, and asking for six costs
    # nothing over asking for three. The ten-minute cadence itself has to come
    # from a scheduler that is not GitHub cron -- see worker-scheduler/ -- which
    # dispatches this same workflow and is not subject to any of the above.
    # Each fire is one short pass; nothing here holds a runner.
    # TEN MINUTES, ROUND THE CLOCK, EVERY DAY.
    #
    # Sig with Jesse and Kirst at the Emmerts, 2026-09-11: "i want 10 min 24/7
    # period." Three windows collapse to one. What that replaced, and the
    # measurement that made the old overnight window indefensible:
    #
    #   day       6/hour, 12:00-21:59 UTC, Mon-Fri
    #   overnight ONE an hour, 00:00-11:59 and 22:00-23:59 UTC, Mon-Fri
    #   weekend   every three hours
    #
    # Big River's board moves overnight and the hourly poll was undersampling
    # it badly. Counted over every price change on badgergrain.com in the five
    # days to 2026-09-11: 59 changes, and 31 of them -- more than half --
    # between 7pm and 8am Central. Overnight they landed at :27 or :28 past
    # almost every single hour, which is this file's own hourly fire at :25
    # arriving and finding a different number EVERY TIME it looked. A check
    # that never once agrees with the previous check is not measuring the
    # board, it is measuring its own clock.
    #
    # The weekend note this replaces said the board "does not move at the
    # weekend" and that polling it more often would make "requests to someone
    # else's server for nothing". The first half is still true. The second is
    # the trade Sig has decided to make, and the cost is one request every ten
    # minutes to one board -- 144 a day, against a source whose own footer says
    # the page self-refreshes every five minutes and its prices are delayed
    # ten. Ten minutes is matched to their stated cadence, not above it.
    #
    # A WEEKEND SIDE EFFECT THAT IS AN IMPROVEMENT. At three-hourly the natural
    # weekend commit interval landed on almost exactly the dashboard's 8-hour
    # gap threshold, so a quiet Saturday could flag a false "reader is down".
    # At ten minutes nothing is ever near that threshold and the signal means
    # what it says again.
    #
    # AND THE ASK IS STILL NOT THE CADENCE. Measured 2026-08-18 to 08-26 with
    # GitHub's own incidents excluded, this minute list delivered 66 of 380
    # fires -- 17.4%, a mean of 1.7 reads an hour. worker-scheduler/ is what
    # actually delivers ten minutes; these crons are the fallback underneath
    # it. Written out rather than as */10 to dodge :00, where every cron on the
    # platform fires at once.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Keep reading for this many minutes (blank = 0 for a hand-fired run, so it finishes at once; the hourly schedule uses 50)"
        required: false
        default: ""

permissions:
  contents: write
  # An alert has to reach a person. A failed run is an email GitHub may or may
  # not send depending on a notification setting nobody remembers choosing, so
  # a pass that cannot be recovered opens an ISSUE on this repository as well:
  # it is durable, it is on the page Sig already looks at, and it cannot be
  # silently filtered into a folder.
  issues: write

concurrency:
  group: read-boyceville
  cancel-in-progress: false     # never interrupt a run mid-write

jobs:
  read:
    runs-on: ubuntu-latest
    # WHY THE LAST PASS FAILED, FOR THE BACKUP JOB BELOW: "read", "publish",
    # "tell", or empty when nothing failed. Only "read" is something another
    # pass can fix.
    outputs:
      why: ${{ steps.pass.outputs.why }}
    # ══════════════════════════════════════════════════════════════════════
    #  A CEILING, BECAUSE THIS JOB HOLDS THE CONCURRENCY GROUP
    # ══════════════════════════════════════════════════════════════════════
    #  Added 2026-08-27 after nine straight hours with no commit -- last read
    #  03:26 UTC, dashboard reading "next run was due 9h 18m ago" -- while
    #  githubstatus.com reported Actions fully operational. So the fires were
    #  not being dropped by the platform this time.
    #
    #  Every other workflow in this repository sets a timeout: bushel-probe 20,
    #  discover 55, dtn-probe 5, gd-sweep 20, probe 20. This one, the only one
    #  that both loops for fifty minutes AND holds a concurrency group, set
    #  none -- so it inherited GitHub's default of SIX HOURS.
    #
    #  That is the exact shape of the outage. One pass hangs on a slow host
    #  with no timeout of its own; the job sits there for up to six hours; the
    #  group is held the whole time; every hourly fire queues behind it and is
    #  then cancelled, because GitHub keeps only the newest pending run per
    #  group. One hang costs six or seven consecutive reads and leaves nothing
    #  red to notice, because the run has not finished.
    #
    #  58 minutes: comfortably past the 50-minute loop and its slack, and
    #  safely under the next hourly fire, so a stuck job is dead before its
    #  successor arrives rather than eating it.
    #  20 and not 58: a scheduled run is now a single pass, measured between
    #  1m20s and 2m11s over all 255 sources. A ceiling of twenty minutes is ten
    #  times a normal pass and still leaves the next fire, twenty minutes
    #  later, a clear runway.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exits non-zero on a bad read, which fails the run, emails you, and
      # leaves data/boyceville.json exactly as it was. A stale file is safe:
      # every consumer checks `checkedAt`. A wrong file is not.
      # ══════════════════════════════════════════════════════════════════
      #  READ, COMMIT AND TELL -- REPEATEDLY, FOR THE REST OF THE HOUR
      # ══════════════════════════════════════════════════════════════════
      #  Everything one pass does now lives in scripts/one-pass.sh, moved
      #  verbatim from the three steps this replaces. What is new is around it:
      #
      #  A FAILED PASS RETRIES AT ONCE. Asked for by Sig on 2026-08-26, in his
      #  words: "if it fails i want it to alert me or retry the run immediately
      #  instead of failing and then waiting for the next scheduled run." The
      #  first retry is immediate, the second and third back off a little,
      #  because a host that just refused us is not helped by being asked again
      #  in the same second.
      #
      #  A PASS THAT CANNOT BE RECOVERED DOES NOT END THE HOUR. It is recorded,
      #  an issue is opened, and the loop carries on -- a network blip at 14:05
      #  must not cost the 14:15, 14:25 and 14:35 reads as well. The job still
      #  goes RED at the end, so nothing is hidden.
      #
      #  THE LOOP IS OFF ON EVERY SCHEDULE as of 2026-08-27 -- see the long
      #  note beside the crons. The machinery stays because a hand-fired run
      #  can still use it, and because it is the thing to reach for if the
      #  cadence ever has to be raised again without raising the fire count.
      - name: Read, commit and tell — for the rest of the hour
        id: pass
        env:
          # NO TOKEN HERE ANY MORE, 2026-09-21. This job used to carry
          # EMMERT_DISPATCH_TOKEN and a ping_sites input, because the pass ended
          # by telling midwestagsupply/badgergrain and .../midwestcommodity to
          # rebuild. emmertadmin does that for them now. See the tail of
          # scripts/one-pass.sh.
          # A hand-fired run finishes at once unless it is asked not to: the
          # concurrency group is held for as long as this loop runs, and
          # somebody pressing the button wants an answer, not a 50-minute lock.
          # ONLY THE TRADING-WINDOW FIRE LOOPS, and it is named exactly.
          # Written first as `event_name == 'schedule'`, which caught the
          # OVERNIGHT and WEEKEND crons too and would have turned one polite
          # hourly read at 3am into four, and the weekend's three-hourly read
          # into four an hour. Those cadences are deliberate -- the board does
          # not move overnight and the comments above say so -- and quadrupling
          # requests to other people's servers for nothing is the opposite of
          # what this change is for. github.event.schedule is the cron string
          # that actually fired, so the loop can be tied to one of them.
          # NEVER ON A SCHEDULE. The input survives so a run fired by hand can
          # still be asked to loop for an experiment; nothing the scheduler
          # starts will hold a runner for longer than one pass.
          LOOP_MINUTES: ${{ inputs.loop_minutes || '0' }}
          EVERY_MINUTES: "10"
        run: |
          set -uo pipefail
          LOOP=${LOOP_MINUTES:-0}; EVERY=${EVERY_MINUTES:-10}
          DEADLINE=$(( $(date +%s) + LOOP * 60 ))
          pass=0; failed=0; firstfail=""
          # THE WHOLE STEP GETS SEVENTEEN MINUTES OF THE JOB'S TWENTY; checkout
          # and setup-node take about one, and three are kept back. Every pass
          # below is handed what is left of that, not a fixed three attempts --
          # see scripts/pass-with-retries.sh for the 33-minute red runs that
          # "three attempts of eight minutes under a ceiling of twenty" caused.
          STEP_END=$(( $(date +%s) + 17 * 60 ))
          why=""
          while : ; do
            pass=$((pass + 1))
            ok=0
            bash scripts/pass-with-retries.sh "pass $pass" $(( STEP_END - $(date +%s) ))
            rc=$?
            case "$rc" in
              0) ok=1 ;;
              3) why=publish ;;
              4) why=tell ;;
              *) why=read ;;
            esac
            if [ $ok -eq 0 ]; then
              failed=$((failed + 1))
              [ -n "$firstfail" ] || firstfail="pass $pass"
              echo "::error title=pass $pass failed ($why)::the loop continues; the run will end red"
            fi
            # Stop if the next pass would run past the deadline. Checked BEFORE
            # sleeping so the job does not sit idle for ten minutes and then quit.
            now=$(date +%s)
            [ $(( now + EVERY * 60 )) -lt $DEADLINE ] || break
            echo "── sleeping ${EVERY}m; $(( (DEADLINE - now) / 60 ))m of the hour left"
            sleep $(( EVERY * 60 ))
          done
          [ $failed -eq 0 ] && why=""
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "passes: $pass, failed: $failed"
          {
            echo "### read boyceville"
            echo ""
            echo "| passes | failed | loop |"
            echo "|---|---|---|"
            echo "| $pass | $failed | ${LOOP}m |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "FAILED_PASSES=$failed" >> "$GITHUB_ENV"
          echo "FIRST_FAIL=$firstfail" >> "$GITHUB_ENV"
          [ $failed -eq 0 ]

  # ══════════════════════════════════════════════════════════════════════════
  #  THE BACKUP RUN
  # ══════════════════════════════════════════════════════════════════════════
  #  Sig, 2026-08-27: "if a run fails i want to immediately trigger a back up
  #  run."
  #
  #  The read job already retries a PASS three times, first retry immediate.
  #  What it could not survive was the run itself dying: a runner that never
  #  came up, a checkout that 500'd, setup-node failing to fetch, or the loop
  #  step ending red because a pass exhausted its three attempts. In every one
  #  of those cases the hour was simply lost and the board waited for the next
  #  cron.
  #
  #  WHY A SECOND JOB AND NOT A RE-DISPATCH. The obvious shape is a
  #  workflow_run trigger that fires `gh workflow run` on failure, but GitHub
  #  will not create a workflow run from an event authenticated with
  #  GITHUB_TOKEN — that is the platform's recursion guard, and it is not
  #  negotiable. Re-dispatching would therefore need a personal access token
  #  with Actions: write on this repository, which is a second long-lived
  #  credential to hold and rotate for something a second job does for free.
  #  A job in the same run needs no token, starts in seconds rather than
  #  waiting on the scheduler, and is visible in the same run log.
  #
  #  IT RUNS ONCE, AND IT RUNS SHORT. One recovery pass with its own three
  #  attempts, no loop. The purpose is to get a current board into the repo
  #  before the next fire, not to re-serve the hour that was lost — the next
  #  cron is at most an hour away and the Emmert sides hold a price for
  #  fourteen. A backup that looped could also still be running when the next
  #  scheduled fire arrives, and the concurrency group would queue that fire
  #  behind it: the recovery would start costing the very runs it exists to
  #  protect.
  #
  #  IF THE BACKUP ALSO FAILS, THAT IS WHEN A PERSON IS TOLD. The issue used
  #  to open on the first red. It now opens only after the retry inside the
  #  pass, and then the backup run, have both been spent — so an issue means
  #  the feed is actually down, not that one request timed out.
  backup:
    needs: read
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ONLY WHEN ANOTHER PASS CAN HELP, AND ONLY ONE THAT FITS.
      #
      # Until 2026-09-20 this ran three eight-minute attempts inside a twelve-
      # minute job, on every red read job whatever had gone wrong. It could not
      # finish, GitHub killed the job at 12m0s, and a job killed by its ceiling
      # runs none of its remaining steps -- so the email and the issue below
      # never once fired, across ~20 red runs a day. And it could not help: the
      # red runs were rebase conflicts, and a fourth read of 1,094 boards meets
      # the same conflict as the first three.
      #
      # Now: the read job says why it failed. A failed READ gets one recovery
      # pass, in nine minutes of this job's twelve, which leaves the alert steps
      # their time. A refused PUSH gets no pass at all, straight to the alert,
      # because a person has to look at the file it names. A pass that
      # published but could not tell the Emmert sites gets neither: the price
      # is out, emmertadmin tells the sites itself, and an email every ten
      # minutes about a courtesy call is how alerts stop being read.
      - name: One recovery pass, immediately
        id: recover
        # Empty counts as a read failure: a read job killed by its own ceiling,
        # or one that died before its last line, never wrote why.
        if: needs.read.outputs.why == 'read' || needs.read.outputs.why == ''
        run: |
          set -uo pipefail
          echo "the read job could not read; running one recovery pass now"
          ok=0
          bash scripts/pass-with-retries.sh "backup" $(( 9 * 60 )) && ok=1
          {
            echo "### backup run"
            echo ""
            echo "| recovered |"
            echo "|---|"
            echo "| $( [ $ok -eq 1 ] && echo yes || echo NO )|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $ok -eq 1 ]; then
            echo "recovered — the board is current again"
          else
            echo "::error title=backup pass failed::the read job's attempts and this one all failed to read -- the feed is down, not flaky"
          fi
          [ $ok -eq 1 ]

      # AN ALERT THAT REACHES A PERSON. GitHub's own failure email depends on a
      # notification setting nobody remembers choosing, and a red tick on a page
      # you are not looking at is not an alert. An issue is durable, it is on
      # the tab Sig already has open, and it says what to do.
      #
      # ONE ISSUE, REOPENED -- not one per failure. A feed that is down for an
      # afternoon would otherwise file twenty-four of them, and twenty-four
      # notifications is the same as none.
      # ══════════════════════════════════════════════════════════════════
      #  AND AN EMAIL, BECAUSE AN ISSUE IS NOT AN ALERT
      # ══════════════════════════════════════════════════════════════════
      #  Sig, 2026-08-27: "if that doesnt run i want an email sent to me
      #  immediately to address the issue."
      #
      #  A GitHub issue is durable and it is the right RECORD, but it reaches a
      #  person only if they watch the repository, and the notification setting
      #  nobody remembers choosing is on, and it misses their filters. On
      #  2026-08-27 this feed was down for six hours and the first anyone knew
      #  was Sig opening a browser tab.
      #
      #  This step runs BEFORE the issue, so the mail is out of the door at the
      #  earliest possible moment, and it cannot fail the job: alert-email.mjs
      #  exits 0 on a missing secret or a bad mail server, with a warning
      #  annotation, because a mail problem must never be the reason a feed
      #  problem goes unreported.
      - name: Email, immediately
        if: failure() || needs.read.outputs.why == 'publish'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO:  ${{ secrets.ALERT_TO }}
          WHY: ${{ needs.read.outputs.why }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${WHY:-}" = "publish" ]; then
            SUBJ="bids: the boards were read but the push was refused"
            BODY="The reader read the boards and then could not push them: a rebase met a file
          that .gitattributes does not declare generated, or the remote kept moving. Another
          read cannot fix that, so none was attempted. The run log's \"conflicting files\"
          annotation names the file.

          run log: $RUN"
          else
            SUBJ="bids: the reader failed AND the backup failed"
            BODY="The read of the elevator boards failed on every attempt that fitted in its job,
          and the recovery pass in the backup job failed too.

          run log: $RUN"
          fi
          node scripts/alert-email.mjs "$SUBJ" "$BODY

          The two Emmert sites hold their last good price for 14 hours and then show
          \"Call for today's price\", so there is time, but this one needs a person."

      - name: Say so, out loud, if a pass could not be recovered
        if: always() && (failure() || needs.read.outputs.why == 'publish')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="read boyceville is failing"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The reader ended red, and either the backup's recovery pass failed too or the failure was a refused push, which a recovery pass cannot fix.
          
          - run log: $RUN
          
          For a refused push, the \"conflicting files\" annotation in the run log names the
          file. Otherwise every read attempt that fitted has been spent, so this is a feed that
          is down rather than one request that timed out. The two Emmert sites hold their last good price for 14 hours and then show
          \"Call for today's price\", so there is time to fix it before anything goes dark.
          
          This issue is reused rather than reopened per failure. Close it when the feed is
          healthy again."
          n=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" \
                --state all --limit 1 --json number,state --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh issue reopen "$n" --repo "${{ github.repository }}" 2>/dev/null || true
            gh issue comment "$n" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
