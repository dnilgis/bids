# Read Big River's Boyceville board and commit it when the price moves.
#
# CADENCE
#
# Every 10 minutes through the trading day, hourly at night, every 4 hours at
# weekends. Their footer says prices are delayed 10 minutes and the page
# self-refreshes every 5, so 10 is matched to the source rather than to a wish.
#
# BEST-EFFORT, AND YOU SHOULD KNOW IT. GitHub does not promise scheduled
# workflows run on time. Under load they are delayed, and occasionally dropped
# entirely. Ten to twenty minute lags at busy times are normal and not a fault.
#
# That is fine here and it is worth being explicit about why: every consumer
# checks `checkedAt`, and the Emmert sites do not withdraw a price until it is
# fourteen hours stale. A twenty-minute lag is inside the noise. The cadence is
# matched to their board -- their footer says prices are delayed ten minutes --
# not to a requirement that anything happen on a particular second.
#
# This repo is PUBLIC, which is what makes this affordable: Actions minutes are
# unmetered on public repos. On a private repo this schedule is about 1,650 runs
# a month against a 2,000-minute allowance — 83%, or 165% if a run ever creeps
# past 60 seconds. If you ever make this repo private, cut the cadence first.
#
# THIS IS THE READER. There is no other one.
#
# A Cloudflare Worker version was built and then removed on 2026-08-17. It
# bought punctuality that this system does not need -- a twenty-minute lag is
# nothing against the fourteen-hour staleness threshold the Emmert sites
# actually use -- and it cost a second vendor, secrets in two places, a runtime
# that differs from Node in ways that already bit us once, and seven-day log
# retention against GitHub's ninety. Actions also has no CPU ceiling, which is
# the limit that would have bound first as more elevators are added.
#
# NO TESTS HERE, DELIBERATELY. The code does not change between polls, so
# running the suite 1,650 times a month proves nothing and doubles the run time.
# Tests run on push instead, in test.yml. A poll that finds no change writes
# nothing and commits nothing.

name: read boyceville

on:
  schedule:
    # Every 10 minutes through the trading day. 12:00-21:59 UTC covers
    # 7am-4pm Central in both CST and CDT, so the clocks changing cannot
    # quietly shift the window out of market hours.
    #
    # WRITTEN OUT RATHER THAN AS */10, TO DODGE THE TOP OF THE HOUR.
    # GitHub's scheduler is best effort and it is most congested on the exact
    # minute -- :00 is when every cron on the platform fires at once, so a job
    # asking for :00 waits behind all of them. Offsetting to :03 costs nothing
    # and lands in a quieter queue. The spacing is still ten minutes.
    #
    # CHANGED 2026-08-26: ONE FIRE AN HOUR, AND THE JOB READS ALL HOUR.
    # This asked for six fires an hour and was given one or two. Measured on
    # 2026-08-26, in the trading window, where every run commits so commits are
    # an exact run count: 13 UTC 3 runs, 14 UTC 2, 15 UTC 1, 16 UTC 1 -- and
    # some of those were fired by hand. Outside the window, where this file
    # asks for ONE an hour, it got one every hour with no misses.
    # Same repository, same day, same scheduler. GitHub is far better at a low
    # frequency than a high one, so the fix is to stop asking for a high one:
    # take the fire that reliably arrives and read repeatedly inside it. See
    # LOOP_MINUTES below.
    - cron: "7 12-21 * * 1-5"
    # Hourly the rest of the weekday, so an overnight move is picked up and a
    # reader that has quietly died gets noticed before morning.
    - cron: "25 0-11,22-23 * * 1-5"
    # Weekends, every 3 hours. Deliberately NOT hourly: the board does not move
    # at the weekend, and the heartbeat only writes every 6 hours, so hourly
    # polling would produce zero additional commits and zero additional
    # information while making requests to someone else's server for nothing.
    #
    # THREE AND NOT FOUR, for two reasons found on 2026-08-17.
    # At 4-hourly the 4h poll is inside the 6h heartbeat and the 8h poll writes,
    # so the natural weekend commit interval is EXACTLY 8.00 hours -- which is
    # exactly the dashboard's gap threshold (HEARTBEAT_H + SLACK_H). With the
    # 10-20 minute scheduler drift this file documents nine lines up, that flags
    # a false gap on essentially every weekend, and the one signal that is meant
    # to mean "the reader has been down since Friday" becomes weekly noise.
    # And two consecutive dropped weekend runs reached 15.95h of staleness
    # against the Emmert side's 14h withdrawal, so a quiet Saturday could pull a
    # perfectly good price off both sites.
    - cron: "25 */3 * * 6,0"
  workflow_dispatch:
    inputs:
      ping_sites:
        description: "Tell the sites even if the price did not move (use this to prove EMMERT_DISPATCH_TOKEN works)"
        type: boolean
        default: false
      loop_minutes:
        description: "Keep reading for this many minutes (blank = 0 for a hand-fired run, so it finishes at once; the hourly schedule uses 50)"
        required: false
        default: ""

permissions:
  contents: write
  # An alert has to reach a person. A failed run is an email GitHub may or may
  # not send depending on a notification setting nobody remembers choosing, so
  # a pass that cannot be recovered opens an ISSUE on this repository as well:
  # it is durable, it is on the page Sig already looks at, and it cannot be
  # silently filtered into a folder.
  issues: write

concurrency:
  group: read-boyceville
  cancel-in-progress: false     # never interrupt a run mid-write

jobs:
  read:
    runs-on: ubuntu-latest
    # ══════════════════════════════════════════════════════════════════════
    #  A CEILING, BECAUSE THIS JOB HOLDS THE CONCURRENCY GROUP
    # ══════════════════════════════════════════════════════════════════════
    #  Added 2026-08-27 after nine straight hours with no commit -- last read
    #  03:26 UTC, dashboard reading "next run was due 9h 18m ago" -- while
    #  githubstatus.com reported Actions fully operational. So the fires were
    #  not being dropped by the platform this time.
    #
    #  Every other workflow in this repository sets a timeout: bushel-probe 20,
    #  discover 55, dtn-probe 5, gd-sweep 20, probe 20. This one, the only one
    #  that both loops for fifty minutes AND holds a concurrency group, set
    #  none -- so it inherited GitHub's default of SIX HOURS.
    #
    #  That is the exact shape of the outage. One pass hangs on a slow host
    #  with no timeout of its own; the job sits there for up to six hours; the
    #  group is held the whole time; every hourly fire queues behind it and is
    #  then cancelled, because GitHub keeps only the newest pending run per
    #  group. One hang costs six or seven consecutive reads and leaves nothing
    #  red to notice, because the run has not finished.
    #
    #  58 minutes: comfortably past the 50-minute loop and its slack, and
    #  safely under the next hourly fire, so a stuck job is dead before its
    #  successor arrives rather than eating it.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exits non-zero on a bad read, which fails the run, emails you, and
      # leaves data/boyceville.json exactly as it was. A stale file is safe:
      # every consumer checks `checkedAt`. A wrong file is not.
      # ══════════════════════════════════════════════════════════════════
      #  READ, COMMIT AND TELL -- REPEATEDLY, FOR THE REST OF THE HOUR
      # ══════════════════════════════════════════════════════════════════
      #  Everything one pass does now lives in scripts/one-pass.sh, moved
      #  verbatim from the three steps this replaces. What is new is around it:
      #
      #  A FAILED PASS RETRIES AT ONCE. Asked for by Sig on 2026-08-26, in his
      #  words: "if it fails i want it to alert me or retry the run immediately
      #  instead of failing and then waiting for the next scheduled run." The
      #  first retry is immediate, the second and third back off a little,
      #  because a host that just refused us is not helped by being asked again
      #  in the same second.
      #
      #  A PASS THAT CANNOT BE RECOVERED DOES NOT END THE HOUR. It is recorded,
      #  an issue is opened, and the loop carries on -- a network blip at 14:05
      #  must not cost the 14:15, 14:25 and 14:35 reads as well. The job still
      #  goes RED at the end, so nothing is hidden.
      #
      #  THE LOOP STOPS BEFORE THE NEXT FIRE, NOT AFTER IT. 50 minutes against
      #  an hourly cron leaves ten minutes of slack, so a slow pass cannot have
      #  the next scheduled run queue behind this one and get cancelled.
      - name: Read, commit and tell — for the rest of the hour
        env:
          TOKEN: ${{ secrets.EMMERT_DISPATCH_TOKEN }}
          PING_SITES: ${{ inputs.ping_sites }}
          # A hand-fired run finishes at once unless it is asked not to: the
          # concurrency group is held for as long as this loop runs, and
          # somebody pressing the button wants an answer, not a 50-minute lock.
          # ONLY THE TRADING-WINDOW FIRE LOOPS, and it is named exactly.
          # Written first as `event_name == 'schedule'`, which caught the
          # OVERNIGHT and WEEKEND crons too and would have turned one polite
          # hourly read at 3am into four, and the weekend's three-hourly read
          # into four an hour. Those cadences are deliberate -- the board does
          # not move overnight and the comments above say so -- and quadrupling
          # requests to other people's servers for nothing is the opposite of
          # what this change is for. github.event.schedule is the cron string
          # that actually fired, so the loop can be tied to one of them.
          LOOP_MINUTES: ${{ inputs.loop_minutes || (github.event.schedule == '7 12-21 * * 1-5' && '50' || '0') }}
          EVERY_MINUTES: "10"
        run: |
          set -uo pipefail
          LOOP=${LOOP_MINUTES:-0}; EVERY=${EVERY_MINUTES:-10}
          DEADLINE=$(( $(date +%s) + LOOP * 60 ))
          pass=0; failed=0; firstfail=""
          while : ; do
            pass=$((pass + 1))
            ok=0
            for attempt in 1 2 3; do
              # PASS_TIMEOUT, and not just the job ceiling above. A job timeout
              # turns a hang into a lost hour; an 8-minute pass timeout turns
              # the same hang into one failed attempt that the retry directly
              # below already knows how to recover. A full 255-source pass has
              # measured between 1m20s and 2m11s, so 8 minutes is a hang, not
              # a slow day.
              if timeout 8m bash scripts/one-pass.sh; then ok=1; break; fi
              if [ $attempt -lt 3 ]; then
                # IMMEDIATELY on the first retry. That is the whole point of it.
                back=$(( (attempt - 1) * 20 ))
                echo "::warning title=pass $pass failed::retrying now (attempt $((attempt+1)) of 3)"
                [ $back -gt 0 ] && sleep $back
              fi
            done
            if [ $ok -eq 0 ]; then
              failed=$((failed + 1))
              [ -n "$firstfail" ] || firstfail="pass $pass"
              echo "::error title=pass $pass failed three times::the loop continues; the run will end red"
            fi
            # Stop if the next pass would run past the deadline. Checked BEFORE
            # sleeping so the job does not sit idle for ten minutes and then quit.
            now=$(date +%s)
            [ $(( now + EVERY * 60 )) -lt $DEADLINE ] || break
            echo "── sleeping ${EVERY}m; $(( (DEADLINE - now) / 60 ))m of the hour left"
            sleep $(( EVERY * 60 ))
          done
          echo "passes: $pass, failed: $failed"
          {
            echo "### read boyceville"
            echo ""
            echo "| passes | failed | loop |"
            echo "|---|---|---|"
            echo "| $pass | $failed | ${LOOP}m |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "FAILED_PASSES=$failed" >> "$GITHUB_ENV"
          echo "FIRST_FAIL=$firstfail" >> "$GITHUB_ENV"
          [ $failed -eq 0 ]

  # ══════════════════════════════════════════════════════════════════════════
  #  THE BACKUP RUN
  # ══════════════════════════════════════════════════════════════════════════
  #  Sig, 2026-08-27: "if a run fails i want to immediately trigger a back up
  #  run."
  #
  #  The read job already retries a PASS three times, first retry immediate.
  #  What it could not survive was the run itself dying: a runner that never
  #  came up, a checkout that 500'd, setup-node failing to fetch, or the loop
  #  step ending red because a pass exhausted its three attempts. In every one
  #  of those cases the hour was simply lost and the board waited for the next
  #  cron.
  #
  #  WHY A SECOND JOB AND NOT A RE-DISPATCH. The obvious shape is a
  #  workflow_run trigger that fires `gh workflow run` on failure, but GitHub
  #  will not create a workflow run from an event authenticated with
  #  GITHUB_TOKEN — that is the platform's recursion guard, and it is not
  #  negotiable. Re-dispatching would therefore need a personal access token
  #  with Actions: write on this repository, which is a second long-lived
  #  credential to hold and rotate for something a second job does for free.
  #  A job in the same run needs no token, starts in seconds rather than
  #  waiting on the scheduler, and is visible in the same run log.
  #
  #  IT RUNS ONCE, AND IT RUNS SHORT. One recovery pass with its own three
  #  attempts, no loop. The purpose is to get a current board into the repo
  #  before the next fire, not to re-serve the hour that was lost — the next
  #  cron is at most an hour away and the Emmert sides hold a price for
  #  fourteen. A backup that looped could also still be running when the next
  #  scheduled fire arrives, and the concurrency group would queue that fire
  #  behind it: the recovery would start costing the very runs it exists to
  #  protect.
  #
  #  IF THE BACKUP ALSO FAILS, THAT IS WHEN A PERSON IS TOLD. The issue used
  #  to open on the first red. It now opens only after the retry inside the
  #  pass, and then the backup run, have both been spent — so an issue means
  #  the feed is actually down, not that one request timed out.
  backup:
    needs: read
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: One recovery pass, immediately
        env:
          TOKEN: ${{ secrets.EMMERT_DISPATCH_TOKEN }}
          PING_SITES: ${{ inputs.ping_sites }}
        run: |
          set -uo pipefail
          echo "the read job ended red; running one recovery pass now"
          ok=0
          for attempt in 1 2 3; do
            if timeout 8m bash scripts/one-pass.sh; then ok=1; break; fi
            if [ $attempt -lt 3 ]; then
              back=$(( (attempt - 1) * 20 ))
              echo "::warning title=backup attempt $attempt failed::retrying now (attempt $((attempt+1)) of 3)"
              [ $back -gt 0 ] && sleep $back
            fi
          done
          {
            echo "### backup run"
            echo ""
            echo "| recovered |"
            echo "|---|"
            echo "| $( [ $ok -eq 1 ] && echo yes || echo NO )|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $ok -eq 1 ]; then
            echo "recovered — the board is current again"
          else
            echo "::error title=backup pass failed three times::the feed is down, not flaky"
          fi
          [ $ok -eq 1 ]

      # AN ALERT THAT REACHES A PERSON. GitHub's own failure email depends on a
      # notification setting nobody remembers choosing, and a red tick on a page
      # you are not looking at is not an alert. An issue is durable, it is on
      # the tab Sig already has open, and it says what to do.
      #
      # ONE ISSUE, REOPENED -- not one per failure. A feed that is down for an
      # afternoon would otherwise file twenty-four of them, and twenty-four
      # notifications is the same as none.
      - name: Say so, out loud, if a pass could not be recovered
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="read boyceville is failing"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The reader ended red AND the backup run that follows it also failed three times.
          
          - run log: $RUN
          
          Both the in-pass retry and the backup run have been spent, so this is a feed that is
          down rather than one request that timed out. Check the run log for which sources
          refused. The two Emmert sites hold their last good price for 14 hours and then show
          \"Call for today's price\", so there is time to fix it before anything goes dark.
          
          This issue is reused rather than reopened per failure. Close it when the feed is
          healthy again."
          n=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" \
                --state all --limit 1 --json number,state --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh issue reopen "$n" --repo "${{ github.repository }}" 2>/dev/null || true
            gh issue comment "$n" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
