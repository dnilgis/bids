# Read Big River's Boyceville board and commit it when the price moves.
#
# CADENCE
#
# Every 10 minutes through the trading day, hourly at night, every 4 hours at
# weekends. Their footer says prices are delayed 10 minutes and the page
# self-refreshes every 5, so 10 is matched to the source rather than to a wish.
#
# BEST-EFFORT, AND YOU SHOULD KNOW IT. GitHub does not promise scheduled
# workflows run on time. Under load they are delayed, and occasionally dropped
# entirely. Ten to twenty minute lags at busy times are normal and not a fault.
#
# That is fine here and it is worth being explicit about why: every consumer
# checks `checkedAt`, and the Emmert sites do not withdraw a price until it is
# fourteen hours stale. A twenty-minute lag is inside the noise. The cadence is
# matched to their board -- their footer says prices are delayed ten minutes --
# not to a requirement that anything happen on a particular second.
#
# This repo is PUBLIC, which is what makes this affordable: Actions minutes are
# unmetered on public repos. On a private repo this schedule is about 1,650 runs
# a month against a 2,000-minute allowance — 83%, or 165% if a run ever creeps
# past 60 seconds. If you ever make this repo private, cut the cadence first.
#
# THIS IS THE READER. There is no other one.
#
# A Cloudflare Worker version was built and then removed on 2026-08-17. It
# bought punctuality that this system does not need -- a twenty-minute lag is
# nothing against the fourteen-hour staleness threshold the Emmert sites
# actually use -- and it cost a second vendor, secrets in two places, a runtime
# that differs from Node in ways that already bit us once, and seven-day log
# retention against GitHub's ninety. Actions also has no CPU ceiling, which is
# the limit that would have bound first as more elevators are added.
#
# NO TESTS HERE, DELIBERATELY. The code does not change between polls, so
# running the suite 1,650 times a month proves nothing and doubles the run time.
# Tests run on push instead, in test.yml. A poll that finds no change writes
# nothing and commits nothing.

name: read boyceville

on:
  schedule:
    # Every 10 minutes through the trading day. 12:00-21:59 UTC covers
    # 7am-4pm Central in both CST and CDT, so the clocks changing cannot
    # quietly shift the window out of market hours.
    #
    # WRITTEN OUT RATHER THAN AS */10, TO DODGE THE TOP OF THE HOUR.
    # GitHub's scheduler is best effort and it is most congested on the exact
    # minute -- :00 is when every cron on the platform fires at once, so a job
    # asking for :00 waits behind all of them. Offsetting to :03 costs nothing
    # and lands in a quieter queue. The spacing is still ten minutes.
    - cron: "3,13,23,33,43,53 12-21 * * 1-5"
    # Hourly the rest of the weekday, so an overnight move is picked up and a
    # reader that has quietly died gets noticed before morning.
    - cron: "25 0-11,22-23 * * 1-5"
    # Weekends, every 3 hours. Deliberately NOT hourly: the board does not move
    # at the weekend, and the heartbeat only writes every 6 hours, so hourly
    # polling would produce zero additional commits and zero additional
    # information while making requests to someone else's server for nothing.
    #
    # THREE AND NOT FOUR, for two reasons found on 2026-08-17.
    # At 4-hourly the 4h poll is inside the 6h heartbeat and the 8h poll writes,
    # so the natural weekend commit interval is EXACTLY 8.00 hours -- which is
    # exactly the dashboard's gap threshold (HEARTBEAT_H + SLACK_H). With the
    # 10-20 minute scheduler drift this file documents nine lines up, that flags
    # a false gap on essentially every weekend, and the one signal that is meant
    # to mean "the reader has been down since Friday" becomes weekly noise.
    # And two consecutive dropped weekend runs reached 15.95h of staleness
    # against the Emmert side's 14h withdrawal, so a quiet Saturday could pull a
    # perfectly good price off both sites.
    - cron: "25 */3 * * 6,0"
  workflow_dispatch:
    inputs:
      ping_sites:
        description: "Tell the sites even if the price did not move (use this to prove EMMERT_DISPATCH_TOKEN works)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: read-boyceville
  cancel-in-progress: false     # never interrupt a run mid-write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exits non-zero on a bad read, which fails the run, emails you, and
      # leaves data/boyceville.json exactly as it was. A stale file is safe:
      # every consumer checks `checkedAt`. A wrong file is not.
      - name: Read every enabled source
        # poll.mjs SUPERSEDES fetch.mjs. Both write data/boyceville.json, so only
        # one may ever be scheduled -- two writers on one artefact has bitten
        # this system three times. Delete scripts/fetch.mjs once this is live.
        #
# NO SOURCE NEEDS A KEY TODAY, and this block is the wiring for the first
        # one that does. The only platform with a credential -- DTN Content
        # Services -- is read through a BROWSER, on the customer's own page,
        # because DTN answered a direct call with "The api key is valid, but it
        # is valid to be used within a browser only". Their page carries their
        # key in the clear, as it must for a browser widget to work, so we hold
        # none.
        #
        # WHEN ONE DOES: a source names the ENVIRONMENT VARIABLE in its manifest
        # (`apiKeyEnv`), never the key, poll.mjs sends it as an `apikey` HEADER
        # so it stays out of the URL and out of every log line and error message
        # in this public repository -- and the variable gets a line here.
        # Forgetting that line is not silent: poll.mjs names the variable, the
        # sources that need it and the remedy, once, before it fetches anything.
        #
        # THE DTN_CS_API_KEY LINE THAT USED TO BE HERE IS GONE, AND ITS ABSENCE
        # IS THE POINT. The thirteen Ag Partners sources are dtn-cs, and dtn-cs
        # is read through a BROWSER: their gateway answers every server-side
        # request with "the api key is valid, but it is valid to be used within
        # a browser only", so poll.mjs loads Ag Partners' own public page and
        # reads the response their own widget asks for. We hold no key.
        #
        # The line survived that change and cost a wrong answer rather than a
        # broken run: asked on 2026-08-20 why the thirteen were not live, I read
        # this file, saw a secret being passed, and told Sig they were waiting
        # on DTN_CS_API_KEY. They were already live. A dead wire that still
        # looks connected is worse than no wire.
        run: node scripts/poll.mjs

      - name: Commit if the price moved, and rebake the dashboard
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          # EVERY SOURCE'S FILE, NOT ONE HARDCODED PATH.
          # This said `git add data/boyceville.json`. With a second source that
          # is a silent outage: poll.mjs writes data/<id>.json and
          # data/index.json, the log says "3 ok, wrote 3", and only Boyceville
          # ever reaches the repo. The dashboard reads index.json, so it would
          # have gone stale while reporting everything healthy.
          git add data/
          git diff --cached --quiet && { echo "nothing moved"; exit 0; }

          # THE DEEP FETCH HAPPENS HERE, NOT AT CHECKOUT.
          #
          # The dashboard's basis chart is drawn from this repo's git history,
          # so baking it needs the full log. But checkout runs on every poll --
          # about 1,650 a month -- while a commit happens only on a price
          # change or a six-hourly heartbeat, a few dozen times a month. Doing
          # the unshallow here means the expensive clone is paid on the runs
          # that need it and no others.
          git fetch --deepen=1000 --quiet || true

          # THE DASHBOARD MUST NEVER BLOCK THE PRICE.
          #
          # This block runs under `bash -e`. A non-zero bake used to abort the
          # step before `git commit`, and because the runner is ephemeral the
          # price fetch.mjs had already written to the working tree was thrown
          # away with it. Worse, a deterministic bake failure -- one bad
          # basisDollars anywhere in the history the chart reads -- fails every
          # subsequent poll identically, so `checkedAt` freezes and fourteen
          # hours later both Emmert sites drop to "Call for today's price".
          # Over a chart.
          #
          # READ-ME-FIRST calls the dashboard optional and deletable. This makes
          # the workflow agree with that.
          # status.mjs SUPERSEDES dashboard.mjs -- both write index.html.
          if node scripts/status.mjs; then
            git add index.html
          else
            echo "::warning::dashboard bake failed; committing the price without it"
          fi
          # The message carries the front month, so `git log --oneline` reads
          # as a price history rather than a list of identical commits, and a
          # heartbeat says so instead of impersonating a price change.
          # Written by poll.mjs via lib/decide.mjs.
          git commit -F .commit-message
          git push

      # ---- TELL THE TWO SITES, INSTEAD OF LEAVING THEM TO ASK ----------------
      #
      # badgergrain.com and midwestcommodity.com both rebuild their price panel
      # from data/boyceville.json in THIS repository, on their own ten-minute
      # cron. On 2026-08-20 that cron was being honoured one to two times an
      # hour against six asked -- measured here, where every run commits, so
      # commits are an exact run count:
      #
      #   2026-08-19  hour 16 -> 14 runs   17 -> 9   18 -> 5   19 -> 6   20 -> 7
      #   2026-08-20  hour 13 ->  1 run    14 -> 2
      #
      # Same cron, same repository. GitHub's scheduler is best effort and that
      # day it was not delivering. At 10:45 Central the feed had moved at 10:25
      # and badgergrain's page still said "as of 9:49am" -- nothing broken, the
      # job simply had not run.
      #
      # So the sites are TOLD. A price move fires repository_dispatch at both,
      # their prices workflow runs at once, and the page is current inside a
      # minute instead of inside a cron nobody can promise.
      #
      # ONLY ON A MOVE. This repository commits on every run, because
      # data/index.json carries `generated: now` -- so "did we commit" is not a
      # signal. A heartbeat is not a move either. poll.mjs writes
      # .changed-sources from decide()'s own `changed` verdict, which is the
      # question already being answered correctly for the file itself.
      #
      # IT FAILS THE RUN IF IT CANNOT TELL THEM. The price is already committed
      # and pushed by this point, so nothing is lost -- but a token that has
      # quietly expired would leave both sites as late as they were before,
      # with every run green. That is the failure this whole day has been about.
      - name: Tell the sites their price moved
        env:
          TOKEN: ${{ secrets.EMMERT_DISPATCH_TOKEN }}
        run: |
          set -u
          # A WAY TO PROVE THE TOKEN WORKS WITHOUT WAITING FOR THE MARKET.
          # Without this the only test is a real price move, which may be an
          # hour away and which fails at the moment you are not watching. Run
          # the workflow by hand with ping_sites ticked and the answer is
          # immediate: both sites rebuild, or this step goes red and says why.
          FORCE="${{ inputs.ping_sites }}"
          if [ "$FORCE" != "true" ] && ! grep -qx boyceville .changed-sources 2>/dev/null; then
            echo "boyceville did not move this run; the sites have nothing to rebuild"
            exit 0
          fi

          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=EMMERT_DISPATCH_TOKEN is not set::boyceville's price moved and           neither site was told. Add a fine-grained token with Contents: write on           midwestagsupply/badgergrain and midwestagsupply/midwestcommodity as the repository           secret EMMERT_DISPATCH_TOKEN. Until then both sites wait for their own cron."
            exit 1
          fi

          [ "$FORCE" = "true" ] && echo "ping_sites was ticked: telling them regardless of whether the price moved"
          PRICED=$(node -e "process.stdout.write(require('./data/boyceville.json').pricedAt||'')" || true)
          fail=""
          for repo in midwestagsupply/badgergrain midwestagsupply/midwestcommodity; do
            code=$(curl -sS -o /tmp/dispatch-resp -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "{\"event_type\":\"price-moved\",\"client_payload\":{\"source\":\"boyceville\",\"pricedAt\":\"$PRICED\",\"from\":\"$GITHUB_REPOSITORY\",\"run\":\"$GITHUB_RUN_ID\"}}" ) || code=000
            if [ "$code" = "204" ]; then
              echo "told $repo (pricedAt $PRICED)"
            else
              echo "::error title=could not tell $repo::HTTP $code $(head -c 300 /tmp/dispatch-resp 2>/dev/null)"
              fail=1
            fi
          done
          [ -z "$fail" ] || exit 1
