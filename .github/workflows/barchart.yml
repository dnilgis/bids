# Build the one feed AGSIST reads.
#
# The Barchart fetch was removed on 2026-10-30 (the subscription is cancelled,
# Sig). This workflow now only rebuilds the merged feed from the scraped boards
# (and any data/barchart.json already in the repository), four times through
# the trading day, and publishes it.

name: Barchart + merge

on:
  schedule:
    - cron: "32 13 * * 1-5"     # 8:32 Central
    - cron: "32 16 * * 1-5"     # 11:32
    - cron: "32 19 * * 1-5"     # 14:32
    - cron: "32 21 * * 1-5"     # 16:32, after the close
  workflow_dispatch:

concurrency:
  group: barchart
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest
    # Every workflow here sets a ceiling; a job with no timeout inherits
    # GitHub's default of SIX HOURS, and this one holds a concurrency group.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ══════════════════════════════════════════════════════════════════
      #  THE GUARDS RUN BEFORE THE CALLS, NOT AFTER
      # ══════════════════════════════════════════════════════════════════
      #  A workflow that has never run is a draft. These three suites cover
      #  every rule the merge applies, and they cost seconds. Running them
      #  first means a broken classifier is caught before 116 API calls are
      #  spent on data it would mangle.
      - name: Test what this run is about to use
        run: |
          node --test test/crop.test.mjs test/delivery.test.mjs \
                      test/merge.test.mjs test/grid.test.mjs

      # ── HOW CLOSE IS THE CANCELLATION? ────────────────────────────────────
      # The whole point of this repository is to stop paying Barchart. That is
      # not a decision anybody can make from a feeling about coverage, and
      # nothing here measured it — so the question kept being asked and never
      # answered.
      #
      # Reads only committed files: the frozen Barchart roster in
      # geocodes/places.json and the places the merge just published. No key, no
      # network, no secret. It writes the number to drive to zero and a worklist
      # ranked by the operator that would close the most facilities at once.
      - name: How much of Barchart do we still need
        run: node scripts/barchart_gap.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # ══════════════════════════════════════════════════════════════════
      #  BUILD THE ONE FEED
      # ══════════════════════════════════════════════════════════════════
      #  Scraped boards plus Barchart, one shape, first-party winning any
      #  disagreement and the loser reported rather than dropped in silence.
      #
      #  Writes data/merged-index.json plus a shard per place under
      #  data/merged/. One file would be about 55 MB at full grid coverage,
      #  which GitHub warns about at 50 and refuses at 100.
      - name: Merge
        run: node scripts/merge_bids.mjs

      # ══════════════════════════════════════════════════════════════════
      #  WHICH MONEY, AND DOES ANY BOARD DISAGREE WITH ITS NEIGHBOURS
      # ══════════════════════════════════════════════════════════════════
      #  lib/currency.mjs stops a board publishing in an UNKNOWN currency. It
      #  cannot stop one publishing in the WRONG one, and Wanstead published
      #  Canadian dollars as American ones for eight days with every guard
      #  agreeing. This is the measurement that separates them: within one
      #  currency, basis sits in a tight band, and a currency error moves every
      #  crop on a board at once.
      #
      #  IT NEVER FAILS THE RUN. It is a report, not a guard -- see the head of
      #  the script for why a threshold tight enough to catch this reliably
      #  would eventually withhold a real price.
      - name: Currency audit
        if: always()
        continue-on-error: true
        run: |
          node scripts/currency_audit.mjs | tee /tmp/cur.txt
          {
            echo '```'
            cat /tmp/cur.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that produced a much smaller feed than the last one is either a
      # real outage or a bug in something above, and either way it must not be
      # committed quietly. This compares against the file already in the repo.
      - name: Refuse a sudden collapse
        run: |
          node -e '
            const fs = require("fs");
            const now = JSON.parse(fs.readFileSync("data/merged-index.json", "utf8"));
            let was = null;
            try {
              was = JSON.parse(
                require("child_process").execSync("git show HEAD:data/merged-index.json", { encoding: "utf8" }));
            } catch { console.log("no previous merged-index.json — nothing to compare against"); process.exit(0); }
            const a = was.counts.rows, b = now.counts.rows;
            console.log(`rows ${a} -> ${b}`);
            if (b < a * 0.6) {
              console.error(`REFUSED: the feed fell from ${a} rows to ${b}, more than 40%.`);
              console.error("  That is an outage or a bug, not a market. Nothing is committed.");
              process.exit(1);
            }
          '

      - name: Commit
        run: |
          git config user.name  "bids"
          git config user.email "bids@users.noreply.github.com"
          # -A over the paths that exist: there is no data/barchart.json to
          # add, and `git add` on a missing path fails.
          git add -A data/ geocodes/places.json
          # `bash`, not a bare path — see tidy.yml. This had the same defect and
          # would have failed on its first run, at the commit, after spending 116
          # API calls.
          bash scripts/commit-and-push.sh "barchart + merge: $(node -e '
            const m=require("./data/merged-index.json");
            process.stdout.write(`${m.counts.rows} bids, ${m.counts.places} places, `
              + `${Object.keys(m.counts.byState).length} states`)')"
