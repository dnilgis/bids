# What Barchart Marketplace's GraphQL will answer, and to whom.
#
# scripts/discover.mjs has known since 2026-08-26 that the entire Barchart
# Marketplace surface is ten responses to one endpoint,
# connect.api.barchart.com/graphql. Nobody has ever asked it a question.
#
# IT WRITES NOTHING. It prints, and a person reads it and decides. There is no
# commit box on this workflow and no data/ path in the script, by construction
# rather than by default -- on 2026-09-24 a workflow whose `enable` box
# defaulted to off rewrote 122 ADM manifests as disabled and took the network
# from 1,096 sources to 982 for two hours. A probe that cannot write cannot do
# that, whatever anyone ticks.
#
#   permissions: contents: read      <- it may not write anything
#
# ── WHAT RUN 1 ESTABLISHED, 2026-09-24 23:46 UTC ───────────────────────────
#
# The endpoint is authenticated PER FIELD, not per request.
#
#     companies(...)        answered with NO credential of any kind
#     node(id).cashBids     "Unauthenticated."
#
# So the x-device-token IS checked, and it is checked on the prices and not on
# the company records. Run 1 also exposed three faults in the probe itself --
# it discarded the partial data GraphQL returns beside an error, it asked
# companies() with no first: and reported the default page size of 10 as if it
# were the roster, and it skipped the AgriCharts test because a different
# request had failed. All three are fixed; the script's header says how.
#
# No token is committed to this repository. Put one in the BARCHART_DEVICE_TOKEN
# secret and tick use_device_token to find out what the token buys.
#
# ── AND THE BIGGER ONE ─────────────────────────────────────────────────────
#
# Nexus's company id decodes to 01:Company:658 and its logo comes from
# media.agricharts.com/sites/658/. If Marketplace company ids are AgriCharts
# site ids, then 519 sources in this repo -- 47% of the network -- can be read
# with a real futures quote instead of the implied one lib/adapters/
# agricharts.mjs is forced into. The `also` box asks two site numbers read off
# live boards this repo already polls: 99 (Legacy Farmers) and 1446 (Kokomo
# Grain).

name: marketplace probe

on:
  workflow_dispatch:
    inputs:
      company:
        description: "A Marketplace company: a displayId like VIA, or a number like 658."
        required: false
        default: "VIA"
      also:
        description: "Also ask these company numbers, comma separated. 99 is Legacy Farmers and 1446 is Kokomo Grain -- both AgriCharts site numbers off boards this repo already reads. Blank to skip."
        required: false
        default: "99,1446"
      roster:
        description: "Also ask companies() with no filter, to see whether the whole tenant roster is readable."
        type: boolean
        default: true
      pages:
        description: "Pages of 100 bid rows to read from the main company. 1 is enough to answer the access question; 5 is the cap."
        required: false
        default: "1"
      use_device_token:
        # THE TOKEN IS A REPO SECRET, NOT AN INPUT. This repo is public: an
        # input is shown in the run's event payload and printed unmasked in the
        # log. Copy the browser's x-device-token into the repo secret
        # BARCHART_DEVICE_TOKEN (it rotates inside half an hour) and tick this.
        description: "Send the x-device-token from the BARCHART_DEVICE_TOKEN repo secret (it rotates inside half an hour, so set it and run within a couple of minutes). Needed for the bids and for the global table. Never paste a token into a box here."
        type: boolean
        default: false
      global_pages:
        description: "Pages of 100 rows to read from the TOP-LEVEL cashBids table -- the one that is not company-scoped. 0 skips it. 25 is a sizing run. 200 is the cap."
        required: false
        default: "25"
      mint:
        description: "Call registerDevice to try minting a device token instead of pasting one. This WRITES to Barchart's system. Leave off unless you mean it."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Five requests and up to five pages. Nothing here is slow; if it hangs it
    # is refusing, and a refusal is an answer worth failing fast on.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Ask
        env:
          COMPANY: ${{ inputs.company }}
          ALSO: ${{ inputs.also }}
          PAGES: ${{ inputs.pages }}
          TOKEN: ${{ inputs.use_device_token && secrets.BARCHART_DEVICE_TOKEN || '' }}
          ROSTER: ${{ inputs.roster }}
          GLOBAL_PAGES: ${{ inputs.global_pages }}
          MINT: ${{ inputs.mint }}
        run: |
          # Through environment variables, never interpolated into the command
          # line: a workflow_dispatch input is a string a human typed.
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          printf '%s' "$PAGES" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::pages must be a number"; exit 1; }
          [ -z "$GLOBAL_PAGES" ] || printf '%s' "$GLOBAL_PAGES" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::global_pages must be a number"; exit 1; }
          [ -z "$ALSO" ] || printf '%s' "$ALSO" | grep -Eq '^[0-9, ]+$' || { echo "::error::also must be numbers, comma separated"; exit 1; }
          printf '%s' "$COMPANY" | grep -Eq '^[A-Za-z0-9_-]{1,40}$' || { echo "::error::company must be a displayId or a number"; exit 1; }
          args=(--company "$COMPANY" --pages "$PAGES")
          [ -n "$ALSO" ]  && args+=(--also "$ALSO")
          [ -n "$TOKEN" ] && args+=(--device-token "$TOKEN")
          [ "$ROSTER" = "true" ] && args+=(--roster)
          [ -n "$GLOBAL_PAGES" ] && args+=(--global-pages "$GLOBAL_PAGES")
          [ "$MINT" = "true" ] && args+=(--mint)
          node scripts/marketplace-probe.mjs "${args[@]}"
