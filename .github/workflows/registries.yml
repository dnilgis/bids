# The state licensed grain dealer and warehouse registries.
#
# WHY THIS EXISTS
#
# Sig: "have you been getting the licensed grain buyers and populating our
# elevator map". The answer was no, and the grey pins on map.html read zero.
# This is the source that fills them.
#
# WHY ONE STATE AND NOT TWENTY
#
# Barchart carries 86 Iowa facilities; we scrape 6; the state licenses 251
# grain dealers and 102 grain warehouses. So the registry is roughly three
# times the commercial feed — but a dealer licence is held by ethanol plants,
# feed mills, processors and farm operations as well as by country elevators,
# and nobody knows yet what share of those 251 is somewhere a farmer can
# actually sell a load. The report step measures that before nineteen more
# scrapers get written.
#
# WHAT IT WRITES. data/registries.json, the survey, the raw pages it read, and —
# because a registry nobody draws is a registry nobody has — geocodes/places.json
# and data/directory.json, which is what map.html reads. It shares a concurrency
# group with sync_known.yml so those last two have one writer at a time. Merging it into known-elevators.json is a separate, deliberate step
# once the numbers have been looked at — putting 251 unverified businesses
# straight onto the map would be the same mistake as trusting a coordinate
# nobody checked.

name: registries — states and the survey

on:
  schedule:
    # 07:10 UTC on the 3rd — the day after the Barchart harvest, so the two
    # never contend and the report reads against a fresh directory.
    - cron: "10 7 3 * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "How many pages to walk on a paginated list once the working parameter is found"
        default: "20"
      states:
        description: "Comma-separated state codes, e.g. IA,MO. Blank does every state in the table."
        default: ""

permissions:
  contents: write

concurrency:
  # THE SAME GROUP AS sync_known.yml, ON PURPOSE. Both workflows rewrite
  # geocodes/places.json and data/directory.json, and one writer per artefact is
  # the rule. Sharing the group is what enforces it: monthly and weekly will
  # almost never collide, and "almost never" is how you get a lost push.
  group: map-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The parser has never met the real page — both Iowa hosts are unreachable
      # from the sandbox it was written in. It carries its own diagnostic for
      # exactly that reason: a run that parses nothing still reports the status,
      # the byte count, the table and row counts, the header cells it found and
      # the first row it could not read, which is everything needed to fix it in
      # one pass instead of three. It now also COMMITS THE PAGES IT READ, under
      # debug/registries/, because a diagnostic can only answer the questions it
      # was written to ask. Three parser fixes have been posted blind into CI and
      # read back out of a log; the page itself is a fixture, so the next one is
      # measured before it ships.
      # WHAT EVERY OTHER STATE PUBLISHES, ASKED ONCE.
      # Three shapes are already confirmed and no two are alike: Iowa is HTML
      # lists with no street address, Illinois is a search form with nothing to
      # page through, and Nebraska is a PDF that DOES carry street addresses.
      # So "nineteen more scrapers like Iowa's" is wrong before it starts. This
      # classifies every candidate — table, form, PDF, Tableau, a page offering
      # a CSV — so the next nineteen are designed against evidence.
      #
      # --keep BRINGS THE PAGES BACK. The 2026-09-04 survey said Texas serves
      # an html table of 36 rows with no <th> at all, and Washington two PDFs
      # of 713 KB and 383 KB. None of that is enough to write a reader — a
      # reader needs the column order, the row shape, and the three rows that
      # will break it. Four parser fixes that day were written from bytes the
      # runner kept, and every one had first been guessed wrong from a summary.
      # This is the only step that reaches these hosts; it is the one chance.
      - name: Survey what the other states publish
        continue-on-error: true
        run: python scripts/survey_registries.py --keep

      # Ten of the twenty-two states checked publish their list as a PDF. pypdf
      # is a pure-python wheel; if it were missing the run would degrade to
      # "this source needs pypdf" rather than losing the state, but there is no
      # reason to make it degrade.
      - name: Install the PDF reader
        run: pip install --quiet pypdf

      # ══════════════════════════════════════════════════════════════════
      #  THE GUARDS RUN BEFORE THE FETCH, NOT AFTER
      # ══════════════════════════════════════════════════════════════════
      #  These two suites cover fetch_registries.py's run-together backstop and
      #  build_geocodes.py's rejection sentences. They were written on
      #  2026-09-01 and NOTHING RAN THEM: npm test globs test/*.test.mjs, so a
      #  python guard sits in the repo passing only when somebody remembers it
      #  by hand. A guard that never runs is a draft. They cost two seconds and
      #  they run before the network calls, so a regression is caught before an
      #  hour of geocoding is spent on data it would mangle.
      - name: Test the readers this run is about to use
        run: |
          python test/registry-run-together.test.py
          python test/unplaced-reason.test.py
          python test/geocode-precision.test.py

      - name: Fetch the state registries
        id: fetch
        continue-on-error: true
        run: |
          python scripts/fetch_registries.py \
            --pages "${{ inputs.pages || '20' }}" \
            --states "${{ inputs.states || '' }}" \
            --dump-dir debug/registries

      # WITHOUT THIS THE MAP DOES NOT MOVE. This workflow committed 442
      # businesses and geocodes/places.json still held no registry section at
      # all, because the only job that places them and rebuilds the directory
      # runs weekly in a different workflow. Four hundred grey pins sat in a
      # data file for up to six days. The registries are fetched to be drawn;
      # they get drawn in the same run.
      - name: Place them and rebuild the directory the map reads
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet zipcodes
          python scripts/build_geocodes.py
          node scripts/build_directory.mjs

      - name: The four questions
        if: always()
        run: |
          pip install --quiet zipcodes
          python scripts/registry_report.py | tee /tmp/report.txt || true
          {
            echo "### the survey"
            echo ""
            echo '```'
            python - <<'SV' 2>/dev/null || echo "no survey file"
          import json, pathlib
          p = pathlib.Path("data/registry-survey.json")
          if p.exists():
              for r in json.loads(p.read_text())["results"]:
                  print("%-3s %-28s %-26s %s" % (r["state"], r["expected"][:28],
                        r.get("shape") or ("HTTP %s" % r.get("status")),
                        (r.get("error") or "")[:50] or ("%s rows" % r.get("rows", ""))))
          SV
            echo '```'
            echo ""
            echo "### state registries"
            echo ""
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A SOURCE THAT PUBLISHES ITS OWN TOTAL IS CHECKED AGAINST IT.
      # Iowa prints "25 out of 251" under its table and three runs took the 25
      # and reported success. If a walk ends short of a total the source itself
      # published, that goes at the top of the summary, not into a diagnostic
      # nobody opens.
      - name: Did any source come up short of its own total
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/registries.json")
          if not p.exists():
              raise SystemExit
          short = json.loads(p.read_text()).get("counts", {}).get("incompleteSources") or []
          if not short:
              print("\n**Every source that publishes a total was read in full.**")
              raise SystemExit
          print("\n### incomplete — the source says there is more\n")
          for s in short:
              print("* `%s` (%s) — %s" % (s["url"], s.get("state"), s["why"]))
          PY

      - name: Show the diagnostic when nothing parsed
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/registries.json")
          if not p.exists():
              print("\n**No file was written at all.**"); raise SystemExit
          d = json.loads(p.read_text())
          if d.get("counts", {}).get("businesses"):
              raise SystemExit
          print("\n### what the pages actually returned\n")
          for diag in d.get("diagnostics", []):
              print("```json"); print(json.dumps(diag, indent=1)[:1800]); print("```")
          PY

      # PUSH THROUGH THE POLLER. The 02:21 run read all 251 Iowa dealers, all
      # 102 warehouses, geocoded 481 addresses over 171 seconds, committed 581
      # businesses — and the push was rejected, because the bid poller had
      # pushed to main during the seven minutes this job was running. It does
      # that every ten minutes through the trading day. Everything the run
      # learned died on the runner and the only sign was a red tick under a
      # summary that said it had succeeded.
      # THE TWO LISTS OF WHAT WE DO NOT HAVE — regenerated whenever the inputs
      # move, because a worklist that goes stale gets phoned twice.
      - name: Rebuild the gap lists
        if: always()
        continue-on-error: true
        run: node scripts/gap_lists.mjs

      # THE WORK FIRST, THE SOUVENIRS SECOND — AND IN TWO COMMITS.
      #
      # Run 91883116181 kept nineteen pages and GitHub refused the push: the
      # Illinois Department of Agriculture ships a Mapbox secret token in the
      # markup of two of its PUBLIC pages, and push protection cannot tell
      # whose key it is. Fair enough. What was not fair enough is what went
      # with it — one blocked path took down the whole commit, so that run's
      # registry fetch, its rebuilt directory and its survey JSON were all
      # lost, and the log said only "repository rule violations".
      #
      # survey_registries.py now strips script and redacts anything
      # credential-shaped before writing a capture, which should end it. This
      # is the belt: the captures go in their own commit, AFTER the data is
      # safely pushed, and that commit is allowed to fail. A page we could not
      # keep costs us a page. It must never cost us the harvest.
      - name: Commit
        if: always()
        run: |
          git add data/registries.json data/registry-survey.json 2>/dev/null || true
          git add data/gaps 2>/dev/null || true
          git rm -q --cached --ignore-unmatch data/gaps/no-website.csv data/gaps/no-board-published.csv 2>/dev/null || true
          [ -d debug/registries ] && git add debug/registries || true
          git reset -q -- debug/registries/survey 2>/dev/null || true
          git add geocodes/places.json data/directory.json 2>/dev/null || true
          n=$(python -c "import json,os;p='data/registries.json';print(json.load(open(p))['counts']['businesses'] if os.path.exists(p) else 0)")
          bash scripts/commit-and-push.sh "registries: $n businesses, plus the state survey [skip ci]"

      - name: Keep the survey's pages, and never at the harvest's expense
        if: always()
        continue-on-error: true
        run: |
          [ -d debug/registries/survey ] || { echo "nothing captured"; exit 0; }
          git add -f debug/registries/survey
          if git diff --cached --quiet; then
            echo "no new captures"
          else
            bash scripts/commit-and-push.sh "registries: the pages the survey read [skip ci]" || {
              echo "::warning::the captures were refused. The harvest above is committed and safe."
              echo "::warning::Look for a credential in debug/registries/survey/* — survey_registries.py should have scrubbed it."
            }
          fi
