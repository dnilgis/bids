# WHAT BOARD IS EACH OF THESE CO-OPERATIVES RUNNING?
#
# The sweep on 2026-08-20 turned up ninety-two operators across eight states and
# a single fact that decides everything after it: almost none of them serve a
# price in their HTML. The board is a JavaScript widget, and the widget belongs
# to one of about six platforms. So the useful question is not "what is Nexus
# Cooperative's corn bid" but "which platform is Nexus running", because one
# adapter written against the platform with the most towns behind it opens
# dozens of operators at once.
#
# This is that question, asked for a LIST of pages in one run.
#
# IT RUNS HERE AND NOT IN THE WORKSPACE. Measured 2026-08-20: curl from the
# workspace to premiercooperative.com, api.dtn.com and agpartners.net all
# returned 000 -- an allowlist proxy that answers for no elevator on earth.
# The runner has open egress and the Chromium this needs already installed.
#
# IT WRITES NOTHING AND PUBLISHES NO NUMBER. permissions is read, so it cannot.
# The output is the log.

name: discover

# THE FORM IS A FORM, NOT A PARAGRAPH — 2026-09-07.
#
# Sig, looking at the Run workflow dialog: "confusing to me". It was seven boxes
# each carrying a sentence, and the sentences had gone stale:
#
#   claimed                                measured 2026-09-07
#   national — 487 pages                   475, of which 396 undecided
#   sweep-2-wi-mn — 15 still unasked       35, of which 34 undecided
#   discover-candidates — the original     136, of which 109 undecided.
#     56, spent                              Not spent. Nowhere near.
#   limit — "the list is 56"               no list is 56
#
# And gd-candidates.txt — 237 undecided Grain Desk pages, the largest untouched
# list in the repository — had no menu entry at all, so there was no way to ask
# for it from this screen.
#
# So: `list` is a DROPDOWN, which needs no prose because the options are the
# labels. NO COUNTS ARE WRITTEN INTO THE FORM — that is what went stale. The
# first step of every run prints the counts instead, from the lists and the
# ledger, where they cannot be wrong.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "list — which list to ask. IGNORED if you fill in urls below."
        type: choice
        default: unfinished
        options:
          - unfinished           # everything the ledger has not decided
          - gradable             # the POET and ADM pages. NOT for the bootstrap any more:
                                 # ADM's is over 700 KB and captureAll's own 400,000-byte
                                 # ceiling cuts it. Use the `gradable bootstrap` workflow.
          - gd-candidates        # Grain Desk
          - national             # the whole country
          - discover-candidates
          - everything-unasked
          - sweep-2-wi-mn
          - agricharts-uncovered
          - bushel-candidates
          - canada
          - weather-only          # the 119 filed agricharts on a weather widget alone
      follow:
        description: "follow — board pages to try per site when it publishes no link of its own"
        type: choice
        default: "2"
        options: ["2", "11"]
      limit:
        description: "limit — how many sites this run (0 = all). Set 1 when asking one page."
        required: false
        default: "20"
      dump:
        description: "dump — ADVANCED, usually blank. Print one whole body of a RECOGNISED FEED, e.g. bootstrap. Does nothing on a page that returned 0 feeds — use the probe workflow for those. Set limit=1 too."
        required: false
        default: ""
      # A GRADABLE BOOTSTRAP IS BIGGER THAN THE DEFAULT CEILING.
      # dumpable() refuses a body over 250,000 bytes so --dump cannot paste a
      # 5 MB bundle into a log. POET's is 202,283 for 36 markets -- 5,618 each
      # -- so the cap sits at about 44 markets, and ADM has 38 facilities in
      # the Barchart gap alone. Over the line the body is simply absent from
      # the log, which reads as "no matching feed" rather than "too big".
      # Raise it only when asking for something known to be large.
      dump_max:
        description: "dump_max — ADVANCED, usually blank. Byte ceiling for dump. Blank = 250000. A gradable bootstrap wants 1000000."
        required: false
        default: ""
      urls:
        description: "urls — one or more pages to ask INSTEAD of the list, space separated. Filling this overrides the list box above."
        required: false
        default: ""
      patience:
        description: "patience — ADVANCED, usually blank. Seconds per page. Blank = 45. Raise it when a run says the network never went quiet."
        required: false
        default: ""
      budget:
        # The job wall is 55 minutes and two sweeps on 2026-08-23 hit it
        # mid-page, ending with no tally and no resume line. discover now stops
        # itself between pages and prints both. Blank uses its own 45-minute
        # default; 0 turns it off.
        description: "budget — ADVANCED, usually blank. Minutes before stopping cleanly. Blank = 45."
        required: false
        default: ""
      start:
        description: "start — ADVANCED, usually 0. Skip this many entries of the list."
        required: false
        default: "0"

permissions:
  contents: read          # it writes nothing, so it may not write anything

jobs:
  discover:
    runs-on: ubuntu-latest
    # Fifty-six pages at up to 45 seconds each is forty minutes in the worst
    # case. The default limit of 20 fits comfortably; this ceiling is for
    # someone who sets limit to 0 and walks away.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # A signature that has stopped matching turns an operator into "no known
      # platform", which reads like an answer. Cheap, and it runs first.
      - name: Test the guards
        run: node --test test/discover.test.mjs test/cdp.test.mjs test/workflows.test.mjs

      # THE ARGUMENTS GO THROUGH env AND NOT INTO THE COMMAND LINE. A
      # workflow_dispatch input is a string a human typed, and
      # `run: node x.mjs ${{ inputs.urls }}` substitutes it into the shell
      # before bash sees it. The safe form costs nothing.
      #
      # The `run: |` is also not decoration. On 2026-08-20 a single-line
      # `run: echo "a $B: $C"` stopped both Emmert repositories building for
      # seventeen hours, because the `: ` inside it opened a YAML mapping and
      # the file stopped parsing. test/workflows.test.mjs now checks for it.
      # WHAT EACH LIST IS WORTH, PRINTED RATHER THAN TYPED INTO THE FORM.
      # Every number that used to be in an input description had gone stale.
      # This reads the lists and the ledger and says what is actually there,
      # at the top of every run, before anything is asked.
      - name: What each list is worth today
        run: node scripts/list_report.mjs

      - name: Ask
        env:
          URLS: ${{ inputs.urls }}
          START: ${{ inputs.start }}
          LIMIT: ${{ inputs.limit }}
          LIST: ${{ inputs.list }}
          DUMP: ${{ inputs.dump }}
          DUMP_MAX: ${{ inputs.dump_max }}
          PATIENCE: ${{ inputs.patience }}
          BUDGET: ${{ inputs.budget }}
          FOLLOW: ${{ inputs.follow }}
        run: |
          # SAY WHEN ONE BOX IS OVERRIDING THE OTHER.
          # 2026-08-21: a stray "s" left in this box silently beat a `list`
          # selection of bushel-candidates. The run asked one page, called "s",
          # and the tally reported it as one unreachable page -- which reads
          # exactly like a co-operative whose site was down. The override is
          # fine; doing it in silence is not.
          # AND --dump HAS TO SURVIVE THE OVERRIDE.
          # This branch dropped it: `dump` was only ever appended on the list
          # path below, so asking one page by URL and asking it to print the
          # body did nothing, silently. Measured 2026-08-23, when the whole
          # point of the run was to read one rescued StoneHedge board and the
          # box that would have printed it was ignored. Same shape as probe.yml's
          # `raw`, which had exactly this gap two runs earlier.
          if [ -n "$URLS" ]; then
            echo "::warning title=urls overrides list::the urls box is not empty, so the ${LIST:-national} list is being IGNORED. Asking: $URLS"
            if [ -n "$DUMP" ]; then
              node scripts/discover.mjs $URLS --dump "$DUMP" ${PATIENCE:+--patience "$PATIENCE"}
            else
              node scripts/discover.mjs $URLS ${PATIENCE:+--patience "$PATIENCE"}
            fi
            exit 0
          fi
          # The name is taken from a fixed set rather than pasted into a path.
          # An input that reaches a filename is an input that can reach ../.
          # EVERY OPTION THE DROPDOWN OFFERS MUST LAND HERE. A menu entry with
          # no case arm is a run that fails after the checkout, and
          # test/discover-boardpage.test.mjs asserts the two lists match.
          case "${LIST:-unfinished}" in
            # THE LEDGER'S OWN BACKLOG. Every site data/platforms.json has not
            # decided: the unreachable ones, which it has promised since
            # 2026-08-30 would come round again, and the no-platform ones
            # written off by a probe older than this one.
            unfinished)          node scripts/unfinished_sites.mjs data/platforms.json > /tmp/unfinished.txt
                                 FILE=/tmp/unfinished.txt ;;
            gradable)            FILE=probe-lists/gradable-sites.txt ;;
            gd-candidates)       FILE=probe-lists/gd-candidates.txt ;;
            national)            FILE=probe-lists/national-2026-08-26.txt ;;
            discover-candidates) FILE=probe-lists/discover-candidates.txt ;;
            everything-unasked)  FILE=probe-lists/everything-unasked-20260829.txt ;;
            sweep-2-wi-mn)       FILE=probe-lists/sweep-2-wi-mn.txt ;;
            agricharts-uncovered) FILE=probe-lists/agricharts-uncovered-2026-09-03.txt ;;
            bushel-candidates)   FILE=probe-lists/bushel-candidates.txt ;;
            canada)              FILE=probe-lists/canada-hosts.txt ;;
            # 119 SITES FILED agricharts ON A BARCHART *WEATHER* ENDPOINT AND
            # NOTHING ELSE. Heartland Co-op was one of them and its board turned
            # out to be a server-rendered matrix on a DIFFERENT HOST -- which is
            # the link discover refused to follow until registrable() landed on
            # 2026-09-13. Every sweep runs --resume and skips a site already
            # called "platform", so nothing else will ever re-ask these. This
            # workflow does not, and it writes nothing. See the list header.
            weather-only)        FILE=probe-lists/weather-only-agricharts-2026-09-14.txt ;;
            *) echo "::error title=unknown list::${LIST} is not one of the menu options."; exit 2 ;;
          esac
          echo "asking $FILE"
          DUMPARG=""
          if [ -n "$DUMP" ]; then DUMPARG="--dump $DUMP"; fi
          if [ -n "$DUMP_MAX" ]; then DUMPARG="$DUMPARG --dump-max $DUMP_MAX"; fi
          BUDGETARG=""
          if [ -n "$BUDGET" ]; then BUDGETARG="--budget $BUDGET"; fi
          PATIENCEARG=""
          if [ -n "$PATIENCE" ]; then PATIENCEARG="--patience $PATIENCE"; fi
          FOLLOWARG=""
          if [ -n "$FOLLOW" ]; then FOLLOWARG="--follow $FOLLOW"; fi
          node scripts/discover.mjs --list "$FILE" --start "${START:-0}" --limit "${LIMIT:-20}" $DUMPARG $BUDGETARG $PATIENCEARG $FOLLOWARG
