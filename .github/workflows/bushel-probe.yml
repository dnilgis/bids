# What came back from a Bushel board, and what rounding rule it uses.
#
# The sibling of dtn-probe.yml. The sweep on 2026-08-25 asked ten Bushel pages
# and every one of them answered -- SEVEN OF THEM CHS REGIONS, one shape. The
# adapter is already written and already reading CHS Farmers Alliance live, so
# what stands between those pages and being source files is knowing what came
# back: which locations, under which ids, and which rounding rule each board's
# cash cell uses.
#
# IT WRITES NOTHING. It prints, and a person reads it and writes the manifests.
# A source file is a claim about somebody else's business.
#
# WHY IT RUNS HERE AND NOT IN A SANDBOX: it needs a real Chromium against a
# real network. Bushel's board is fetched by the customer's own page in the
# reader's browser, so loading that page is the whole of the authorisation --
# we hold no key, exactly as with dtn-cs.
#
# ── THE TIMEOUT IS ARITHMETIC, NOT A ROUND NUMBER — 2026-08-29 ──────────────
#
# Run 90064858519 was CANCELLED at the twenty-minute job timeout having asked
# ten of seventeen pages. Nothing failed: the probe was still working, and
# seven candidates were never asked at all.
#
# The cost of one page is bounded and knowable. A page that does not answer is
# loaded ONCE PER TARGET and each load waits PROBE_MS for a matching response,
# so the worst case is
#
#     pages x targets x PROBE_MS  =  17 x 2 x 60s  =  34 minutes
#
# of waiting alone, before a single page load is counted. Twenty minutes could
# never have finished the list. The job now allows 75, which covers the worst
# case with room for the loads themselves, and a `probe_ms` box makes a fast
# sighting run possible without editing this file.
#
# THIS IS THE SAME CLASS OF ERROR AS THE 10-MINUTE CRON: a schedule set by what
# felt reasonable rather than by what the work costs. Measure, don't reason.

name: bushel probe

on:
  workflow_dispatch:
    inputs:
      list:
        description: "Probe every page in probe-lists/bushel-candidates.txt (15 of them as of 2026-08-29 evening). Leave the page box below blank."
        type: boolean
        default: true
      page:
        description: "Or ONE cash-bids page, e.g. https://www.chs-herman.com/grain/cash-bids/ — only used when the box above is off"
        required: false
        default: ""
      probe_ms:
        description: "How long to wait for each address, in milliseconds. 60000 is the default and the list's timeout is sized for it; 25000 gives a faster sighting run that may miss a slow board."
        required: false
        default: "60000"
      dump_body:
        description: "Print more of an unreadable body (characters). 200 is normal. Turn it up to ~6000 to read a whole location of the older bushelops shape so its branch can be written from evidence."
        required: false
        default: "200"

permissions:
  contents: read          # it writes nothing, so it may not write anything

jobs:
  probe:
    runs-on: ubuntu-latest
    # 17 pages x 2 targets x 60s = 34 minutes of waiting in the worst case,
    # before the page loads themselves. See the note at the top of this file.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The probe decides whether a board gets an EXACT identity check or a
      # widened tolerance, so its arithmetic is checked before it is trusted.
      # The first version of it read the futures SYMBOL as the price and
      # reported "no rule explains it" for a board that floors cleanly -- the
      # most expensive wrong answer it can give.
      - name: Test the guards
        run: node --test test/bushelprobe.test.mjs test/bushel.test.mjs test/cdp.test.mjs

      - name: Ask
        env:
          LIST: ${{ inputs.list }}
          PAGE: ${{ inputs.page }}
          PROBE_MS: ${{ inputs.probe_ms }}
          BUSHEL_DESCRIBE_CHARS: ${{ inputs.dump_body }}
        run: |
          if [ "$LIST" = "true" ]; then
            node scripts/bushel-probe.mjs --list probe-lists/bushel-candidates.txt
          elif [ -n "$PAGE" ]; then
            # Through an environment variable, never interpolated into the
            # command line: a workflow_dispatch input is a string a human typed.
            node scripts/bushel-probe.mjs --page "$PAGE"
          else
            echo "::error title=nothing to ask::turn the list box on, or give one page."
            exit 2
          fi
