# What is behind a DTN Content Services site id?
#
# One site id can carry a whole co-operative — Ag Partners' e0172401 returns 176
# records across THIRTEEN locations. This asks, and prints a manifest skeleton
# per location with the rounding mode MEASURED rather than assumed.
#
# IT RUNS HERE AND NOT ANYWHERE ELSE BECAUSE OF WHERE api.dtn.com WILL ANSWER.
# It returns 403 to every non-browser client on every path under /markets/,
# existing or not, so none of this can be worked out from a sandbox and a 403
# there carries no information about whether a path is real. On the runner it is
# one button.
#
# IT LOADS A PAGE AND HOLDS NO KEY. The first version of this called the API
# directly and DTN answered:
#
#   {"type":"Authorization","id":"AGW-403=002","status":403,
#    "message":"The api key is valid, but it is valid to be used within a browser only."}
#
# The key was valid; their gateway scopes widget keys to browser use. So this
# loads the customer's own page in the Chromium the runner already has, and
# reads the response their own widget asked for. Their key is public in their
# page, because that is the only way a browser widget can work — we do not need
# a copy of it and do not keep one.
#
# NEXT ONE UP: Premier Cooperative, siteId E0266901, page
# https://www.premiercooperative.com/agricultural/detailed-cash-bids
# Whether that is three towns or thirty is one run of this away.
#
# It writes nothing. Fill in every SET THIS in the output, geocode each street
# address, and only then commit a manifest and enable it.

name: dtn probe

on:
  workflow_dispatch:
    inputs:
      list:
        description: "Probe every site in probe-lists/dtn-sites.txt (8 of them). Leave the three boxes below blank."
        type: boolean
        default: true
      site:
        description: "Or ONE site id, e.g. e0172401 — only used when the box above is off"
        required: false
        default: ""
      page:
        description: "The customer's public cash-bids page, whose own widget asks for the feed"
        required: false
        default: ""
      operator:
        description: "Company name, to save typing it into every skeleton"
        required: false
        default: ""

permissions:
  contents: read          # it writes nothing, so it may not write anything

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # A signature or a rounding rule that has stopped working turns a good
      # board into a refusal, or worse, a bad one into a manifest.
      - name: Test the guards
        run: node --test test/dtnprobe.test.mjs test/dtncs.test.mjs test/cdp.test.mjs

      - name: Ask
        # No secrets. The page carries the customer's own key, as it must for
        # the widget to work at all, and the browser sends it.
        #
        # THE INPUTS GO THROUGH env AND NOT INTO THE COMMAND LINE. These were
        # interpolated with ${{ }} straight into `run:`, which substitutes what
        # a human typed into the shell before bash ever sees it -- a page URL
        # with a semicolon in it would have run as a command. Only someone who
        # can already press the button can reach this, so it was never the
        # sharpest risk in the repository; it is also the form people copy.
        env:
          USE_LIST: ${{ inputs.list }}
          SITE: ${{ inputs.site }}
          PAGE: ${{ inputs.page }}
          OPERATOR: ${{ inputs.operator }}
        run: |
          if [ "$USE_LIST" = "true" ]; then
            node scripts/dtn-probe.mjs --list probe-lists/dtn-sites.txt
          elif [ -n "$SITE" ]; then
            if [ -n "$OPERATOR" ]; then
              node scripts/dtn-probe.mjs --site "$SITE" --page "$PAGE" --operator "$OPERATOR"
            else
              node scripts/dtn-probe.mjs --site "$SITE" --page "$PAGE"
            fi
          else
            echo "Nothing asked: turn the list box on, or give a site id."
            exit 2
          fi
