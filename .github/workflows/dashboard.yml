# Bake index.html from whatever is in data/.
#
# Runs after the pollers, on a schedule and on any push that touches data.
# It reads the directory, so adding an elevator means adding a poller that
# writes data/<name>.json -- nothing here changes, and neither does the page.

name: Dashboard

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/dashboard.mjs"

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # A page that reports on broken sources must not itself be broken.
      - name: Test
        run: node --test test/dashboard.test.mjs

      - name: Bake
        run: node scripts/dashboard.mjs

      - name: Commit if it changed
        run: |
          git config user.name  "dashboard"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "dashboard: $(TZ=America/Chicago date '+%-d %B %-I:%M%P')"
            git push
          fi
