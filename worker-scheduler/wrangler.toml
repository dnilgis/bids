name = "agsist-bid-scheduler"
main = "src/index.js"
compatibility_date = "2026-08-27"

# THE CADENCE SIG ASKED FOR, FROM A SCHEDULER THAT KEEPS IT.
# Cloudflare cron triggers use UTC, same as GitHub, so these are the same
# clock as poll.yml's own crons and the two cannot drift apart when the
# clocks change.
# ══════════════════════════════════════════════════════════════════════════════
#  DAY-OF-WEEK IS SPELT OUT, AND THAT IS NOT A STYLE CHOICE
# ══════════════════════════════════════════════════════════════════════════════
#  2026-09-05: the first Git-triggered build uploaded the code fine and then
#  FAILED setting the triggers:
#
#      invalid cron string: 20 */3 * * 6,0 [code: 10100]
#
#  Cloudflare's weekday field is 1-7, and 0 is not in it. GitHub Actions uses
#  0-6 with 0 = Sunday. The same five characters therefore mean different days
#  on the two schedulers that this repository runs side by side, and one of
#  them rejects what the other requires.
#
#  Cloudflare's own documentation recommends the three-letter abbreviations for
#  exactly this reason, so that is what these use. MON-FRI and SAT,SUN mean the
#  same thing to every cron implementation there is and cannot be read as the
#  wrong days by either scheduler.
#
#  poll.yml keeps 1-5 and 6,0 because those are correct FOR GITHUB. Do not
#  "make them consistent" — consistency between two systems that number the
#  week differently is how this bug is written.
# ══════════════════════════════════════════════════════════════════════════════

[triggers]
# FIVE IS THE WHOLE ACCOUNT'S ALLOWANCE ON THE FREE PLAN, not this Worker's.
# https://developers.cloudflare.com/workers/platform/limits -- "Number of Cron
# Triggers per account": Free 5, Paid 250. worker/wrangler.toml called three
# "the free-plan ceiling", which is the wrong shape of limit, and between the
# two Workers this repository was defining seven.
#
# src/index.js routes each of these to a LIST of workflows, so five slots buys
# five cadences, not five workflows.
crons = [
  # TEN MINUTES, ROUND THE CLOCK, EVERY DAY.                -> poll.yml
  #
  # Sig, 2026-09-11, asking for ten minutes 24/7 and nothing else. This
  # replaced three separate
  # slots -- trading day, weekday overnight, weekend -- and so it gives a slot
  # BACK: the account is on five Cron Triggers total and this Worker now spends
  # three of them instead of five.
  #
  # The overnight window was the one that mattered. Over the five days to
  # 2026-09-11, 31 of 59 price changes on the live site landed between 7pm and
  # 8am Central, and the hourly poll found a different price on essentially
  # every fire -- undersampling, not a quiet board.
  "*/10 * * * *",


  # THE DISCOVERY SWEEP. Was six fixed hours; now every two, which is 12 fires
  # a day out of the same one slot.
  #
  # This is the queue that turns a grey pin green, and on 2026-09-05 it is the
  # binding constraint on the whole project: 4,097 of 4,581 known elevators
  # have no website on file at all, and 45 sites a run means 91 runs to clear
  # it.                                             -> discover-sweep.yml
  "35 */2 * * *",

  # OVERNIGHT, ONCE. registries.yml was on `10 7 3 * *` -- monthly, on GitHub
  # cron, which at the 17.4% measured in src/index.js is an expected run about
  # twice a year. It is the harvest that took the directory to 2,295
  # businesses and put 426 of them on real street points. sync_known.yml wants
  # the same quiet hour and rides along for nothing.
  #                          -> registries.yml, sync_known.yml
  "10 7 * * *",
]
